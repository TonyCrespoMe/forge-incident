[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-incident"
version = "0.1.0"
description = "Local-first generator of realistic, deterministic DFIR/purple-team investigation packages (student + instructor bundles) for security training."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ForgeIncident Contributors" },
]
keywords = [
    "dfir",
    "incident-response",
    "purple-team",
    "security-training",
    "log-generation",
    "cybersecurity-education",
    "siem",
    "splunk",
    "elastic",
    "sentinel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Education :: Testing",
]

dependencies = [
    "typer>=0.12.3",
    "pydantic[email]>=2.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "rich>=13.7.1",
    "python-dateutil>=2.9.0",
    "faker>=25.0.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.28.0"]
openai = ["openai>=1.30.0"]
gemini = ["google-generativeai>=0.7.0"]
grok = ["openai>=1.30.0"]        # xAI's API is OpenAI-SDK-compatible; no separate client needed
ollama = ["httpx>=0.27.0"]
webui = ["streamlit>=1.36.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]
all = ["forge-incident[claude,openai,gemini,grok,ollama,webui,dev]"]

[project.urls]
Homepage = "https://github.com/forge-incident/forge-incident"
Issues = "https://github.com/forge-incident/forge-incident/issues"

[project.scripts]
forge-incident = "forge_incident.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_incident"]

[tool.hatch.build.targets.sdist]
include = [
    "src/forge_incident",
    "scenarios",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's entire API is built on function-call defaults --
# `def cmd(x: int = typer.Option(...))` is the documented, required idiom, not
# the mutable-default bug B008 exists to catch. Without this, every CLI command
# signature is a false positive.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# These two modules are lookup TABLES, not prose: one entry per line is the
# whole point, and wrapping each entry across three lines would turn a
# scannable table into something much harder to read and diff. Line length is
# enforced everywhere else.
"src/forge_incident/emitters/windows.py" = ["E501"]   # EventType -> Windows Event ID mapping
"src/forge_incident/scenario_categories.py" = ["E501"]  # the 56-category taxonomy

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
