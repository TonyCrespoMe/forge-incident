  - id: q2
    question: "How would you distinguish the attacker's CloudTrail activity from the legitimate activity in the same account?"
    answer: >
      Three signals together. Caller IP: the attacker calls from
      45.132.192.77, while legitimate CI activity comes from the office NAT
      198.51.100.44. User-agent: the attacker uses raw Boto3, while the CI
      runner uses aws-sdk-go. Behaviour: the attacker's identity (jkessler)
      calls GetCallerIdentity, ListBuckets and IAM APIs it had never called
      before, including an AccessDenied on Secrets Manager that shows
      exploration rather than work. The strongest comparison is Joel's own
      legitimate call at 09:18 — same identity, but from the office NAT
      using the AWS CLI against the single bucket his service reads. The CI
      deployments at 09:00 and 11:40 are likewise legitimate and should not
      be flagged.
