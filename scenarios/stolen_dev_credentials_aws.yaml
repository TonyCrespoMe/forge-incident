  - id: q4
    question: "The obvious first response is to rotate Joel's access key. Why is that insufficient, and what else is required?"
    answer: >
      Because the attacker created independent access before that key would
      be revoked: IAM user svc-metrics-agent, with AdministratorAccess
      attached and its own access key minted at 15:04. That credential is
      unaffected by rotating Joel's. Full eviction requires deleting the
      backdoor user and its key, rotating Joel's key, re-enabling the
      CloudTrail trail, reviewing every IAM change made in the window, and
      auditing for any other resources created while the trail was stopped.
      The GitHub token must be revoked separately — it is a different
      credential with a different scope.
    related_event_ids: [aws-create-user, aws-attach-admin, aws-backdoor-key, aws-stop-trail]
    hint: "Ask what access survives the obvious fix."
