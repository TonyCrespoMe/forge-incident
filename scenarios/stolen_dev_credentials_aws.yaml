  - id: q5
    question: "The attacker stopped CloudTrail logging. What can you still determine, and why?"
    answer: >
      The StopLogging call itself was recorded, because it was written to
      the trail before logging ceased — an attacker cannot erase the record
      of erasing the record. That gives a precise timestamp for when
      visibility ended and confirms the backdoor user was live, since the
      call was made by svc-metrics-agent rather than jkessler. What happened
      after 15:11 is unknown from CloudTrail and must be reconstructed from
      other sources: VPC flow logs, S3 server access logs, billing data, and
      the resources' own state.
    related_event_ids: [aws-stop-trail, aws-backdoor-key]
    points: 3

  - id: q6
    question: "What does the evidence suggest but not prove, and what would you request?"
    answer: >
      Two things. First, repository theft: 780 MB of sustained outbound
      traffic to a code-hosting provider from the laptop while the user was
      away is consistent with bulk cloning using the stolen GitHub token,
      but no repository audit log was provided, so this is inference. The
      GitHub organization audit log should be requested. Second, activity
      after CloudTrail was stopped at 15:11 is entirely unknown. Also
      request VPC flow logs, S3 server access logs, full forensics on
      NWA-DEV-041 including the extension package, and an inventory of all
      IAM principals to confirm no other backdoor accounts exist.
    related_event_ids: [repo-cloning, aws-stop-trail]
    hint: "Two separate credentials were stolen. Only one of them has good log coverage here."
    points: 4

  - id: q7
    question: "Name two configuration weaknesses, independent of the malicious extension, that made this incident far worse."
    answer: >
      First, long-lived static IAM access keys stored in plaintext on a
      developer workstation — the stolen key was 14 months old and had never
      been rotated. Short-lived credentials via SSO/IAM Identity Center or
      instance roles would have made the harvested file nearly worthless.
      Second, the developer identity held permissions to create IAM users
      and attach AdministratorAccess; a role scoped to what a backend
      engineer actually needs would have blocked the persistence step
      entirely, limiting the incident to data theft with no lasting foothold.
    related_event_ids: [harvest-aws-creds, aws-create-user, aws-attach-admin]
    points: 4
