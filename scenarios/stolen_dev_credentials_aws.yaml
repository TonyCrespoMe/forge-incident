  - id: q3
    question: "What data was exfiltrated, and how do you know it left the environment?"
    answer: >
      Customer analytics exports from the S3 bucket nwa-customer-exports —
      roughly 3.2 GB, retrieved by GetObject calls from the attacker's
      external address at 14:41. The retrieval itself is what confirms
      exfiltration, as distinct from the earlier ListObjectsV2 which only
      shows enumeration. The subsequent egress cost anomaly corroborates the
      transfer volume.
