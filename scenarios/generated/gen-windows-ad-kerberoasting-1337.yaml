mitre_tactics:
  - Initial Access
  - Discovery
  - Credential Access
  - Lateral Movement
  - Persistence
  - Defense Evasion

learning_objectives:
  - Identify Kerberoasting attacks through TGS-REQ patterns and encryption downgrades
  - Correlate domain reconnaissance activity with subsequent credential access
  - Trace lateral movement using compromised service account credentials
  - Recognize log-clearing events and work around forensic gaps
  - Distinguish normal service account behavior from attacker abuse
  - Reconstruct an attack timeline across multiple hosts despite incomplete evidence

