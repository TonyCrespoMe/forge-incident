scenario_id: gen-windows-ad-kerberoasting-1337
title: "Kerberoasting Attack with Compromised Service Account"
description: >
  An external attacker gains initial access to Meridian Financial's
  network through a compromised VPN account belonging to a contractor.
  After establishing a foothold on a developer workstation, the attacker
  performs reconnaissance to enumerate domain service principal names
  (SPNs), requests Kerberos TGS tickets for multiple service accounts,
  and cracks them offline. The attacker successfully recovers the
  password for the SQL service account (svc-sql), which has local admin
  rights on several database servers. Using these credentials, the
  attacker authenticates to a production SQL server, establishes
  persistence via a scheduled task, attempts to access sensitive customer
  financial data, and clears the Security event log to cover their
  tracks. The investigation requires correlating Windows authentication
  events (Kerberos ticket requests with RC4 encryption), process
  telemetry showing reconnaissance tools (PowerView, Rubeus), lateral
  movement via valid credentials, and a deliberate log-clearing event
  that creates a forensic gap on the target server.
student_briefing: >
  Meridian Financial's Security Operations Center flagged unusual
  Kerberos activity originating from DEV-WS-07, a developer workstation
  in the Application Development department. The alert indicated multiple
  TGS-REQ events for service accounts within a short time window,
  followed several hours later by an anomalous interactive logon to the
  production database server SQL-PROD-03 by a service account that
  normally only performs non-interactive authentication. The database
  administrator reports that portions of the Security event log on
  SQL-PROD-03 are missing for a critical two-hour period. You have been
  provided Windows event logs from the domain controller (DC01), the
  initial workstation (DEV-WS-07), and the database server (SQL-PROD-03),
  as well as Palo Alto firewall logs for the incident window (2026-05-01,
  09:00-18:00 UTC). Your task is to determine how the attacker initially
  accessed DEV-WS-07, what reconnaissance and credential access techniques
  they used, how they moved to the database server, what they did there,
  and to assess the scope of potential data access despite the log gap.
difficulty: advanced
