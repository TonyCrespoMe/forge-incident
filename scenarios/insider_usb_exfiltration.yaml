  name: Cadence Industrial Group
  domain: cadenceindustrial.example
  industry: Industrial Manufacturing
  timezone: UTC

mitre_tactics:
  - Collection
  - Exfiltration

learning_objectives:
  - Build a behavioural case from activity that is entirely within the subject's permissions
  - Use volume and breadth against a personal baseline rather than an absolute threshold
  - Recognize archiving/encryption before copy as a DLP-evasion step
  - Identify removable media as an exfiltration channel from file paths alone
  - Correlate file activity against HR timeline context (resignation date)
  - Separate what the evidence proves from what it merely suggests
  - Control false positives in a dataset where most activity is legitimate

tags: [insider-threat, data-theft, usb, removable-media, exfiltration, dlp-evasion, intermediate]

