answer_key:
  - id: q1
    question: "Does this activity represent data theft, or normal end-of-employment work? State your assessment and your confidence."
    answer: >
      Assessed as deliberate data theft, with high confidence. The
      assessment rests on the combination of four factors, none of which is
      sufficient alone: (1) volume far exceeding the subject's baseline,
      (2) breadth extending well outside his own territory into accounts he
      has never previously accessed, (3) destination being removable media
      rather than the approved cloud workspace he used for all prior work,
      and (4) password-protected archiving immediately before copying, which
      has no legitimate business purpose and defeats content inspection.
      Authorization is not in question — he had permission for every file.
      The finding is about pattern and intent, not access rights.
    related_event_ids: [archive-encrypted, usb-copy-1, usb-copy-2, crm-bulk-export]
    hint: "No single event proves this. Build the case from the combination."
    points: 4

  - id: q2
    question: "What data was copied to removable media, and how much?"
    answer: >
      Two confirmed copies to volume E: (label SANDISK64, serial
      A4C7-91E2). First, archive_personal.7z at 240 MB, containing the
      three-year contract set, the FY26 sales pipeline, and the FY26-FY28
      product roadmap. Second, crm_contacts_all.csv at 32 MB, a company-wide
      customer contact export. Roughly 272 MB total. Both copies are
      confirmed by matching SHA-256 hashes between the source file and the
      file written to E:.
    related_event_ids: [usb-copy-1, usb-copy-2, archive-encrypted, crm-bulk-export]
    points: 3

  - id: q3
    question: "Why is the 7-Zip archiving step significant beyond simply bundling files?"
    answer: >
      The command line includes -p (password protection) and -mhe=on
      (encrypt headers, hiding even the filenames). Encrypting data being
      moved within one's own control serves no legitimate purpose, and it
      specifically defeats DLP content inspection that would have recognized
      the pricing and customer data. The subject had no history of using
      7-Zip for legitimate work. This is the clearest evidence of intent to
      conceal, as distinct from carelessness.
    related_event_ids: [archive-encrypted]
    points: 3

  - id: q4
    question: "Which events in this dataset are NOT part of the misconduct?"
    answer: >
      Four: the Monday logon, the Q4-Ashworth proposal saved to the approved
      workspace, the colleague Priya Nwosu's shared file save (which is not
      even the subject's activity), the September expense report, and the
      handover notes for his replacement. The expense report and handover
      notes are especially important — they occur during the same window as
      the theft and demonstrate that not every action by a subject under
      investigation is misconduct.
    related_event_ids: [mon-login, mon-normal-work, mon-colleague-share, benign-expense-report, benign-handover]
    hint: "Check the destination folder and the actor on each event."
    points: 3

  - id: q5
    question: "What does this evidence NOT prove, and what would you need to establish it?"
    answer: >
      It does not prove what happened to the data after it left the laptop —
      whether it was ever opened, shared, or provided to the competitor. It
      does not prove the archive's contents, since it is encrypted and the
      password is unknown; contents are inferred from what was staged
      immediately before. It does not establish whether other channels
      (personal cloud storage, email, printing) were also used, since only
      endpoint logs were provided. To close these gaps: forensic acquisition
      of the USB device if recoverable, proxy and email logs for the same
      period, DLP logs, and physical badge records to corroborate presence.
    related_event_ids: [archive-encrypted, usb-copy-1]
    hint: "Be careful here. This report may be read by legal counsel."
    points: 4

  - id: q6
    question: "Why did none of this generate a real-time alert, and what control would change that?"
    answer: >
      Every action was performed by an authorized user with valid
      credentials accessing files they had permission to access, so no
      access-control or authentication rule was violated. Detection requires
      behavioural rules rather than permission-based ones: alerting on
      volume anomalies against a per-user baseline, on access to data
      outside a user's normal territory, on writes to removable media
      (especially archives), and on encrypted-archive creation. Placing
      departing employees under heightened monitoring from the resignation
      date onward would have caught this within a day rather than nine.
    related_event_ids: [offboarding-review, usb-first-insert, archive-encrypted]
    points: 3
