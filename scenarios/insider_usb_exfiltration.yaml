# ForgeIncident scenario file
# =============================================================================
# INTERMEDIATE TIER (curriculum I2). The insider-threat scenario, and the
# only bundled scenario where the subject NEVER does anything they lack
# permission to do.
#
# Why that matters pedagogically: every other scenario in this project has a
# bright line — a web shell, a stolen hash, a foreign login. Here there is
# no such line. Every file the subject opens is a file he is authorized to
# open. Every tool he uses is approved. The malice lives entirely in the
# PATTERN: volume, timing relative to his resignation, selection of the
# company's most commercially sensitive material, and the destination.
#
# This trains a genuinely different skill: building a behavioural case from
# authorized activity, and being appropriately careful about it. An analyst
# who cries "attack!" at the first file copy is wrong; so is one who says
# "authorized, nothing to see". The right answer is evidence-led and hedged.
#
# The scenario is heavily loaded with BENIGN events on purpose (roughly a
# third of the timeline). Insider cases are the hardest place to control
# false positives, so the scoring system's precision metric matters more
# here than anywhere else in the catalog.
#
# HR context (resignation date) is given in the student briefing because in
# a real insider investigation you always have it, and withholding it would
# make the exercise artificial rather than harder.
# =============================================================================

scenario_id: insider-usb-exfiltration-01
title: "Departing Employee Data Theft to Removable Media"

description: >
  Marcus Feldt, a senior sales engineer at Cadence Industrial Group, gives
  four weeks' notice on 3 September. He is leaving for a direct competitor,
  though he has told his manager only that he is "moving on".

  Over his final week he copies a large volume of commercially sensitive
  material to a personal USB drive: the full customer pricing database
  export, three years of contract renewals, the FY26 sales pipeline, and
  the proprietary product roadmap. He accesses all of it using his own
  credentials, from his own laptop, during working hours. He holds
  legitimate permissions for every single file.

  Three things distinguish this from his normal work. First, VOLUME — he
  copies more in one week than in the preceding six months combined.
  Second, BREADTH — he touches accounts and regions outside his own
  territory, which he has access to but has never previously opened.
  Third, DESTINATION — the copies go to removable media rather than the
  approved cloud workspace he has used for every prior piece of work.

  He also archives the material into a password-protected 7-Zip file before
  copying, which is not something he has ever done for legitimate work and
  which defeats the DLP content inspection that would otherwise have
  flagged the pricing data.

  The activity is discovered during routine offboarding review, nine days
  after it began. By then the USB device has been connected and removed
  five times and the employee has left the business.

student_briefing: >
  Cadence Industrial Group's offboarding process includes a review of
  departing employees' file activity. That review has flagged the account
  of Marcus Feldt (Sales Engineering), whose last day was 30 September.
  HR has confirmed he resigned on 3 September and has since joined a
  competitor.

  You have Windows event logs, including Sysmon, from his laptop covering
  22-30 September.

  Determine whether the flagged activity represents data theft or normal
  end-of-employment work. Marcus held legitimate access to the systems
  involved, so "he was authorized" is not by itself an answer either way —
  your assessment needs to rest on what the pattern of activity shows.

  Be precise about what the evidence supports, what it suggests but does
  not prove, and what you would need in order to be certain. This matters:
  your report may be read by HR and by legal counsel, and an overstated
  conclusion is as much of a problem as a missed one.

difficulty: intermediate
