answer_key:
  - id: q1
    question: "When did this intrusion actually begin, and how? State your confidence."
    answer: >
      Initial access was at 22:14 on 15 October — nine days and eight hours
      before encryption — via a successful VPN authentication for the
      contract radiologist rvasquez from 176.53.14.209, an address outside
      her normal region, with no MFA challenge recorded. Her legitimate
      session earlier that afternoon from 203.0.113.140 establishes the
      baseline. HIGH confidence on the timing and the account.

      HOW the credential was obtained cannot be determined. Mail gateway
      logs were not retained and there is no telemetry from her personal
      device. Phishing, infostealer malware, and purchase from a credential
      broker are all consistent with the available evidence. This should be
      reported as an open question, not resolved by assumption.
    related_event_ids: [vpn-login-anomalous, benign-contractor-normal]
    hint: "The visible incident is four hours long. The intrusion is not."
    points: 5

  - id: q2
    question: "Was data stolen before encryption? This determines breach notification obligations — be precise."
    answer: >
      Yes. 41 GB was uploaded from FS-CORE-02 (10.8.20.14) to an external
      cloud storage address at 04:54 on 24 October, roughly 100 minutes
      BEFORE encryption began. The staging that produced it is visible 42
      minutes earlier: rar.exe creating split, password-protected volumes
      from the Patients and Finance shares. For a healthcare provider this
      makes the incident a data breach in addition to a ransomware event,
      with a materially different regulatory position. Note the ransom note
      also claims data theft, but the firewall record is the proof — the
      attacker's own claim is not evidence.
    related_event_ids: [data-staging, exfil-to-cloud, ransom-note]
    points: 5

  - id: q3
    question: "A large backup job read 380 GB from the same shares that night. Why is it not the exfiltration?"
    answer: >
      Three reasons, any one of which is sufficient. The executing account
      is svc-avbackup (the legitimate backup identity), not the compromised
      svc-imaging. The destination is the internal backup appliance
      10.8.30.9, not an external address. And it runs on the same schedule
      every night in the dataset, so it is not anomalous in timing. The real
      staging occurs two hours later using rar.exe with split, encrypted
      volumes written to a local temp directory — a completely different
      tool, account, and destination.
    related_event_ids: [decoy-backup-job, data-staging, exfil-to-cloud]
    hint: "Compare the account, the tool, and the destination — not just the volume."
    points: 5

  - id: q4
    question: "What happened to EDR coverage, and how does that change what you can conclude?"
    answer: >
      The CrowdStrike sensor on FS-CORE-02 was uninstalled at 05:26 via
      msiexec, 74 minutes before encryption began. That uninstall is the
      last EDR event for the host. Consequently the shadow copy deletion,
      the encryption, and everything else on that server afterwards do NOT
      appear in EDR and had to be reconstructed from Windows events and
      firewall traffic. Any conclusion about FS-CORE-02 after 05:26 rests on
      those two sources only. The gap has a precise start time because the
      uninstall was recorded before the agent stopped — and a sensor going
      silent while its peers keep reporting is itself a detectable condition
      that should have alerted.
    related_event_ids: [edr-tamper, shadow-copy-delete, encryption-begins]
    points: 5

  - id: q5
    question: "How did the attacker get from one VPN account to domain-wide administrative access?"
    answer: >
      Three steps across six days. (1) Quiet AD enumeration from the jump
      host on day one, specifically querying accounts with Service Principal
      Names — reconnaissance for Kerberoasting. (2) A single Kerberos
      service ticket request for svc-imaging using RC4 on day four; one
      request rather than a burst, which is why no threshold rule fired. The
      cracking happened offline and left no trace. (3) First use of the
      cracked svc-imaging account on day seven, authenticating to the file
      server — a host an imaging service account has no business reason to
      touch and had never touched before.
    related_event_ids: [ad-enumeration, kerberoast-request, svc-account-first-use, share-enumeration]
    points: 4

  - id: q6
    question: "How was the encryptor distributed to 214 endpoints, and why does the mechanism matter?"
    answer: >
      Via Group Policy. The AVH-Workstation-Baseline GPO was modified on the
      domain controller to add an immediate scheduled task executing
      svcupd.exe from a network share. It matters because it explains the
      speed and scale — one modification reaches every domain-joined machine
      — and because it changes remediation: the GPO must be reverted and
      audited before any system is restored, or recovered machines will
      simply re-execute the task.
    related_event_ids: [gpo-deployment, encryption-begins, encryption-spread]
    points: 4

  - id: q7
    question: "Which events in this dataset are legitimate activity?"
    answer: >
      Three. Renata's genuine VPN session at 15:54 on 15 October from her
      normal regional address; the monthly patch window on 19 October run by
      svc-avbackup on the file server; and the nightly backup job at 02:00
      on 24 October. All three occur inside the intrusion window and two of
      them involve the very host and shares the attacker targeted, which is
      what makes them worth ruling out explicitly rather than ignoring.
    related_event_ids: [benign-contractor-normal, benign-patch-window, decoy-backup-job]
    points: 4

  - id: q8
    question: "List what the evidence does NOT establish, and what you would request."
    answer: >
      Not established: the initial access vector for the VPN credential;
      everything that occurred on FS-CORE-02 after the EDR uninstall at
      05:26 beyond what Windows and firewall logs show; whether persistence
      exists elsewhere in the estate; whether other accounts were
      compromised during the six-day gap between Kerberoasting and the
      service account's first use; and the exact contents of the exfiltrated
      archive, which was password-protected.

      Request: mail gateway logs for 8-15 October if any retention exists,
      full disk images of FS-CORE-02 and AVH-JUMP-03, VPN concentrator logs
      predating 15 October, EDR telemetry from all other hosts for the full
      window, netflow to corroborate the 41 GB transfer independently, and
      a domain-wide audit for additional GPO modifications and new accounts.
    related_event_ids: [vpn-login-anomalous, edr-tamper, kerberoast-request, exfil-to-cloud]
    hint: "Regulators and insurers will read this. Overstating is worse than incomplete."
    points: 5
