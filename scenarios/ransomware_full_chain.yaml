# ForgeIncident scenario file
# =============================================================================
# EXPERT TIER (curriculum E1). The first expert-tier scenario and the most
# demanding in the catalog. Per models.Difficulty, expert means the evidence
# is incomplete and partly misleading, and a correct answer must say so.
#
# The three expert-tier devices, all live here:
#
# 1. VISIBILITY GAP. The EDR agent on the file server was uninstalled by the
#    attacker (`edr-tamper`) four hours before encryption. Everything that
#    happened on FS-CORE-02 after that point is absent from CrowdStrike and
#    must be inferred from firewall and Windows telemetry. Students who
#    reconstruct only what the EDR shows will materially understate the
#    incident.
#
# 2. MISLEADING ARTIFACT. A legitimate, scheduled backup job
#    (`decoy-backup-job`) runs at 02:00 on the same server, reading the same
#    file shares at high volume, hours before the real staging. It looks
#    exactly like data collection. It is not. An analyst who reports it as
#    the exfiltration will produce a confidently wrong timeline.
#
# 3. MULTI-DAY DWELL. Nine days from initial access to encryption, with two
#    quiet periods. The pre-encryption activity is the part nobody looked
#    at, and reconstructing it is the actual exercise — by the time the
#    ransom note appears, the interesting work is already over.
#
# Also note what is deliberately NOT here: no phishing email is included,
# because the mail gateway logs were not retained. The initial access vector
# must be assessed from the endpoint evidence alone, and the honest answer
# is a qualified one.
# =============================================================================

scenario_id: ransomware-full-chain-01
title: "Ransomware: Nine-Day Dwell to Domain-Wide Encryption"

description: >
  Ardent Valley Health Services is encrypted across its file and application
  servers on the morning of 24 October. The visible incident is four hours
  long. The actual intrusion began nine days earlier.

  Initial access is via a compromised VPN account belonging to a contract
  radiologist, authenticating from an unusual geography with no MFA
  enforced. Mail gateway logs were not retained, so whether the credential
  came from phishing, an infostealer, or a broker cannot be determined from
  the evidence provided — a qualified assessment is the correct answer here,
  not a confident guess.

  Over the following week the actor performs slow, low-volume
  reconnaissance: AD enumeration, a single Kerberoasting request, and
  credential access on a jump host. They obtain a service account with
  administrative rights across the server estate. Two quiet periods (three
  days, then two) separate the phases, which is what makes the activity
  hard to correlate as one campaign.

  On day nine they stage data for double extortion, exfiltrate 41 GB to a
  cloud storage provider, uninstall the EDR agent on the
  file server, delete volume shadow copies, and deploy the encryptor via
  Group Policy to 214 endpoints.

  Two complications for the analyst. First, the EDR uninstall creates a
  genuine visibility gap on FS-CORE-02 — the encryption itself is not in
  CrowdStrike at all and must be reconstructed from firewall and Windows
  evidence. Second, a legitimate scheduled backup job runs at 02:00 that
  same night, reading the same shares at high volume; it superficially
  resembles data staging and is a trap for anyone pattern-matching on
  "large read volume".

student_briefing: >
  Ardent Valley Health Services began its incident response at 06:40 on
  24 October when staff arrived to find file shares inaccessible and ransom
  notes on multiple servers. Clinical systems are degraded and the
  organization is operating on paper.

  You have four sources covering 15-24 October: CrowdStrike Falcon
  detections, Windows event logs from the VPN concentrator, jump host and
  file server, firewall traffic logs, and Palo Alto perimeter logs.

  Leadership needs three things from you, in this order. First, how far
  back does this go — when did the intruder actually get in, and how?
  Second, was data stolen before encryption, and if so how much and to
  where? This determines whether the organization has a breach
  notification obligation. Third, what is the current state of the
  attacker's access.

  Note that the environment's telemetry is not uniform across the whole
  period or across all hosts. Where the evidence does not support a
  conclusion, say so explicitly and state what you would need — an
  overstated timeline is worse than an incomplete one when regulators and
  insurers will read this report.

difficulty: expert
version: "1.0"
seed: 20251024

organization:
  name: Ardent Valley Health Services
  domain: ardentvalley.example
  industry: Healthcare
  timezone: UTC

mitre_tactics:
  - Initial Access
  - Discovery
  - Credential Access
  - Lateral Movement
  - Collection
  - Exfiltration
  - Defense Evasion
  - Impact

learning_objectives:
  - Reconstruct a multi-day dwell period across separated activity bursts
  - Distinguish a legitimate high-volume backup job from attacker data staging
  - Identify EDR tampering and correctly scope the resulting visibility gap
  - Establish whether exfiltration preceded encryption (breach notification trigger)
  - Recognize shadow copy deletion as the point recovery options narrow
  - Trace GPO-based mass deployment as the encryption delivery mechanism
  - State an initial access vector as a qualified assessment when logs are missing
  - Separate proven facts from inference in a report with regulatory consequences

tags: [ransomware, double-extortion, edr-tampering, vpn, kerberoasting, gpo, expert]

start_time: "2025-10-15T22:14:00Z"

actors:
  contractor:
    username: rvasquez
    email: rvasquez@ardentvalley.example
    display_name: Renata Vasquez
    department: Radiology
    role_title: Contract Radiologist
    employee_id: AVH-C-0442
    is_compromised: true
  svc_backup:
    # Legitimate service account. Its scheduled job is the misleading
    # artifact -- it does exactly what data staging looks like, nightly.
    username: svc-avbackup
    email: svc-avbackup@ardentvalley.example
    display_name: "Backup Service Account"
    department: Infrastructure
    role_title: Automation Identity
    is_privileged: true
  svc_imaging:
    # The account the attacker cracks and then abuses.
    username: svc-imaging
    email: svc-imaging@ardentvalley.example
    display_name: "Imaging Platform Service Account"
    department: Infrastructure
    role_title: Service Account
    is_compromised: true
    is_privileged: true
  attacker:
    username: unknown
    email: unknown@unattributed.example
    display_name: Unattributed External Actor
    is_compromised: true

hosts:
  vpn:
    hostname: AVH-VPN-01
    ip_address: 10.8.0.5
    host_type: server
    os: windows
    os_version: "Windows Server 2022 Standard"
    domain_joined: true
  jump:
    hostname: AVH-JUMP-03
    ip_address: 10.8.12.33
    host_type: server
    os: windows
    os_version: "Windows Server 2022 Standard"
    domain_joined: true
  fileserver:
    hostname: FS-CORE-02
    ip_address: 10.8.20.14
    host_type: server
    os: windows
    os_version: "Windows Server 2019 Datacenter"
    domain_joined: true
  dc:
    hostname: AVH-DC-01
    ip_address: 10.8.4.10
    host_type: domain_controller
    os: windows
    os_version: "Windows Server 2022 Datacenter"
    domain_joined: true

timeline:
  # ==== DAY 1 (15 Oct) — initial access ==================================
  - id: vpn-login-anomalous
    at: "+0m"
    event_type: account_login_success
    log_sources: [windows]
    severity: high
    actor: contractor
    host: vpn
    description: >
      INITIAL ACCESS. A successful VPN authentication for the contract
      radiologist at 22:14 local, from an address geolocated well outside
      her normal working region. No MFA challenge is recorded for this
      account. This is the earliest attacker activity in the dataset and
      the anchor for the whole timeline.

      IMPORTANT for the answer key: HOW the credential was obtained cannot
      be determined here. Mail gateway logs were not retained and no
      endpoint telemetry exists for her personal device. Phishing,
      infostealer, and credential broker are all consistent with the
      evidence, and the correct report says so.
    mitre:
      technique_id: T1078
      technique_name: "Valid Accounts"
      tactic: Initial Access
    extra:
      logon_type: 3
      authentication_package: "RADIUS"
      mfa_challenge: "none recorded"
      source_geolocation: "outside normal region"
    network:
      protocol: tcp
      src_ip: 176.53.14.209
      src_port: 55214
      dst_ip: 10.8.0.5
      dst_port: 443
      action: allow

  - id: benign-contractor-normal
    at: "-6h20m"
    event_type: account_login_success
    log_sources: [windows]
    severity: info
    actor: contractor
    host: vpn
    description: >
      BENIGN. Renata's genuine VPN session earlier the same afternoon, from
      her usual regional address. The baseline that makes the 22:14 session
      anomalous — without this, "unusual geography" is an assertion rather
      than a finding.
    extra:
      logon_type: 3
      authentication_package: "RADIUS"
      source_geolocation: "normal region"
    network:
      protocol: tcp
      src_ip: 203.0.113.140
      src_port: 51002
      dst_ip: 10.8.0.5
      dst_port: 443
      action: allow

  - id: ad-enumeration
    at: "+41m"
    event_type: lateral_movement
    log_sources: [windows, crowdstrike]
    severity: medium
    actor: contractor
    host: jump
    description: >
      Quiet Active Directory enumeration from the jump host. Deliberately
      LOW severity and low volume — a handful of LDAP queries over twenty
      minutes, well under any rate threshold. This is what competent
      reconnaissance looks like, and it is why the campaign was not
      correlated at the time.
    mitre:
      technique_id: T1087.002
      technique_name: "Account Discovery: Domain Account"
      tactic: Discovery
    process:
      pid: 5120
      ppid: 4408
      name: powershell.exe
      command_line: 'powershell -NoProfile -Command "Get-ADUser -Filter * -Properties ServicePrincipalName | Where-Object {$_.ServicePrincipalName -ne $null}"'
      parent_name: mstsc.exe
      integrity_level: High

  - id: jump-host-session
    at: "+1h4m"
    event_type: account_login_success
    log_sources: [windows]
    severity: medium
    actor: contractor
    host: jump
    description: >
      The compromised VPN account opens an RDP session to the jump host.
      Renata's role does not require jump host access; the account has it
      only because contractors were placed in a broad access group. Standing
      access nobody audited is what turns a single credential into a
      foothold.
    mitre:
      technique_id: T1078
      technique_name: "Valid Accounts"
      tactic: Initial Access
    extra:
      logon_type: 10
      source_ip: "10.8.0.5"

  - id: defender-exclusion
    at: "+1h29m"
    event_type: registry_modified
    log_sources: [windows, crowdstrike]
    severity: high
    actor: contractor
    host: jump
    description: >
      A Defender exclusion is added for C:\Windows\Temp. Small, quiet, and
      done on night one — nine days before it matters. Early environment
      preparation like this is routinely dismissed as administrative noise
      when it appears in isolation.
    mitre:
      technique_id: T1562.001
      technique_name: "Impair Defenses: Disable or Modify Tools"
      tactic: Defense Evasion
    process:
      pid: 5344
      ppid: 5120
      name: powershell.exe
      command_line: 'powershell -Command "Add-MpPreference -ExclusionPath C:\Windows\Temp"'
      parent_name: mstsc.exe
      integrity_level: High

  - id: benign-helpdesk
    at: "+1d9h12m"
    event_type: account_login_success
    log_sources: [windows]
    severity: info
    actor: svc_backup
    host: jump
    description: >
      BENIGN. Routine infrastructure work on the jump host during business
      hours the following day. Ordinary administrative activity that shares
      a host with the intrusion.
    extra:
      logon_type: 10
      source_ip: "10.8.12.9"

  # ==== QUIET PERIOD (3 days) ============================================

  # ==== DAY 4 (19 Oct) — credential access ===============================
  - id: kerberoast-request
    at: "+3d19h6m"
    event_type: credential_harvested
    log_sources: [windows]
    severity: high
    actor: contractor
    host: dc
    description: >
      A single Kerberos service ticket request for the svc-imaging account,
      using RC4 encryption. ONE request — not a burst — which is why no
      threshold-based Kerberoasting rule fired. The cracking happens offline
      and leaves no trace anywhere in this dataset; the next time
      svc-imaging appears, the attacker already has its password.
    mitre:
      technique_id: T1558.003
      technique_name: "Steal or Forge Kerberos Tickets: Kerberoasting"
      tactic: Credential Access
    extra:
      service_name: "svc-imaging"
      ticket_encryption_type: "0x17 (RC4-HMAC)"
      requesting_account: "rvasquez"

  - id: benign-patch-window
    at: "+3d21h30m"
    event_type: process_created
    log_sources: [windows, crowdstrike]
    severity: info
    actor: svc_backup
    host: fileserver
    description: >
      BENIGN. The monthly patch window: scripted installs and a service
      restart on the file server. Legitimate administrative activity that
      happens to touch the same host the attacker later targets.
    process:
      pid: 3312
      ppid: 780
      name: powershell.exe
      command_line: 'powershell -File C:\Scripts\Patch-Apply.ps1 -Cycle 2025-10'
      parent_name: services.exe
      integrity_level: System

  # ==== QUIET PERIOD (2 days) ============================================

  # ==== DAY 7 (21 Oct) — lateral movement ================================
  - id: svc-account-first-use
    at: "+6d18h22m"
    event_type: account_login_success
    log_sources: [windows]
    severity: high
    actor: svc_imaging
    host: fileserver
    description: >
      The cracked service account is used for the first time, authenticating
      to the file server. Critical detail for the timeline: svc-imaging is
      an IMAGING platform account with no legitimate reason to authenticate
      to the general file server, and it has never done so before in this
      dataset. Six days have passed since initial access.
    mitre:
      technique_id: T1078.002
      technique_name: "Valid Accounts: Domain Accounts"
      tactic: Lateral Movement
    extra:
      logon_type: 3
      authentication_package: "Kerberos"
      source_workstation: "AVH-JUMP-03"
      source_ip: "10.8.12.33"

  - id: share-enumeration
    at: "+6d18h51m"
    event_type: lateral_movement
    log_sources: [windows, crowdstrike]
    severity: medium
    actor: svc_imaging
    host: fileserver
    description: >
      File share enumeration across the estate. Note this is svc-imaging
      doing it, not a human account — automation accounts do not normally
      browse shares.
    mitre:
      technique_id: T1135
      technique_name: "Network Share Discovery"
      tactic: Discovery
    process:
      pid: 6640
      ppid: 5988
      name: net.exe
      command_line: '"net.exe" view \\\\FS-CORE-02 /all'
      parent_name: cmd.exe
      integrity_level: High

  - id: backup-inventory-probe
    at: "+6d19h40m"
    event_type: lateral_movement
    log_sources: [windows]
    severity: high
    actor: svc_imaging
    host: fileserver
    description: >
      The attacker enumerates the backup infrastructure — catalog shares and
      appliance configuration. Ransomware operators reconnoitre backups
      before encrypting, because recoverable backups are the only thing that
      makes refusing to pay viable. Seeing this and understanding what it
      predicts is the difference between a reactive and a proactive
      response.
    mitre:
      technique_id: T1083
      technique_name: "File and Directory Discovery"
      tactic: Discovery
    process:
      pid: 6702
      ppid: 5988
      name: cmd.exe
      command_line: '"cmd.exe" /c dir \\\\10.8.30.9\\backups /s /b'
      parent_name: powershell.exe
      integrity_level: High

  - id: benign-backup-prior-night
    at: "+7d3h46m"
    event_type: file_created
    log_sources: [windows, crowdstrike]
    severity: info
    actor: svc_backup
    host: fileserver
    description: >
      BENIGN, and the key to disarming the decoy. The SAME backup job, at
      the SAME time, on the night BEFORE the attack. Its presence proves the
      02:00 high-volume read is a nightly schedule rather than attacker
      activity — which is precisely how a student should rule out the
      misleading artifact instead of guessing.
    process:
      pid: 2140
      ppid: 780
      name: avbackup-agent.exe
      command_line: '"C:\Program Files\ArdentBackup\avbackup-agent.exe" --job nightly-full --target 10.8.30.9'
      parent_name: services.exe
      integrity_level: System
    file:
      path: \\10.8.30.9\backups\FS-CORE-02\2025-10-23-full.avb
      filename: 2025-10-23-full.avb
      size_bytes: 401230659584

  # ==== DAY 9 (23-24 Oct) — the loud night ===============================
  - id: tool-staging
    at: "+8d2h11m"
    event_type: malware_download
    log_sources: [windows, crowdstrike, palo_alto]
    severity: critical
    actor: svc_imaging
    host: fileserver
    description: >
      The attacker's toolkit is downloaded to the Defender-excluded
      directory created on night one — rar.exe for archiving and the
      encryptor payload. Note the destination path matches the exclusion
      added eight days earlier: the two events are separated by more than a
      week and only make sense together.
    mitre:
      technique_id: T1105
      technique_name: "Ingress Tool Transfer"
      tactic: Command and Control
    file:
      path: C:\Windows\Temp\svchost_cache\rar.exe
      filename: rar.exe
      sha256: "5f1e7a03c94b2d86015fe3a7bd249c0e836f14b7a05de92c318b64f70ad2153e"
      size_bytes: 619008
    network:
      protocol: tcp
      src_ip: 10.8.20.14
      src_port: 50114
      dst_ip: 176.53.14.209
      dst_port: 443
      action: allow
      app: ssl
      bytes_sent: 8420
      bytes_received: 3218432

  - id: decoy-backup-job
    at: "+8d3h46m"
    event_type: file_created
    log_sources: [windows, crowdstrike]
    severity: info
    actor: svc_backup
    host: fileserver
    description: >
      THE MISLEADING ARTIFACT. The nightly scheduled backup runs at 02:00,
      reading 380 GB across the same file shares the attacker later stages
      from, and writing to the backup appliance. High-volume reads, a
      service account, the middle of the night — it matches the shape of
      data staging almost perfectly.

      It is legitimate. Evidence: it runs on the same schedule every night
      of the dataset, the destination is the internal backup appliance
      (10.8.30.9) rather than an external address, and the executing account
      is svc-avbackup, not the compromised svc-imaging. An analyst who
      reports this as the exfiltration will produce a confident, wrong
      timeline — and will also miss the real staging two hours later.
    process:
      pid: 2288
      ppid: 780
      name: avbackup-agent.exe
      command_line: '"C:\Program Files\ArdentBackup\avbackup-agent.exe" --job nightly-full --target 10.8.30.9'
      parent_name: services.exe
      integrity_level: System
    file:
      path: \\10.8.30.9\backups\FS-CORE-02\2025-10-24-full.avb
      filename: 2025-10-24-full.avb
      size_bytes: 408021893120

  - id: data-staging
    at: "+8d5h58m"
    event_type: data_staging
    log_sources: [windows, crowdstrike]
    severity: critical
    actor: svc_imaging
    host: fileserver
    description: >
      THE REAL STAGING. Patient records and finance shares are archived into
      split RAR volumes in a temp directory. Compare against the backup job
      two hours earlier: different account (svc-imaging, the compromised
      one), different tool (rar.exe, not the backup agent), different
      destination (local temp, not the appliance), and split volumes sized
      for upload rather than a single backup image.
    mitre:
      technique_id: T1560.001
      technique_name: "Archive Collected Data: Archive via Utility"
      tactic: Collection
    process:
      pid: 7104
      ppid: 6640
      name: rar.exe
      command_line: '"C:\Windows\Temp\svchost_cache\rar.exe" a -m0 -v500M -hp C:\Windows\Temp\svchost_cache\d.rar \\\\FS-CORE-02\\Patients\\* \\\\FS-CORE-02\\Finance\\*'
      parent_name: cmd.exe
      sha256: "5f1e7a03c94b2d86015fe3a7bd249c0e836f14b7a05de92c318b64f70ad2153e"
      integrity_level: High
    file:
      path: C:\Windows\Temp\svchost_cache\d.rar
      filename: d.rar
      sha256: "e30b942a17cf5d68204ab7e13c9f0562d8a41e75b930cf28647a105de2b83f91"
      size_bytes: 44023414784

  - id: exfil-to-cloud
    at: "+8d6h40m"
    event_type: data_exfiltration
    log_sources: [firewall_syslog, palo_alto]
    severity: critical
    actor: svc_imaging
    host: fileserver
    description: >
      THE EXFILTRATION, and the answer to leadership's breach-notification
      question. 41 GB uploaded to a public cloud storage provider from the
      file server, completing roughly 100 minutes before the encryptor
      runs. This PRECEDES encryption, which
      means this is a data breach as well as a ransomware incident — a
      materially different regulatory position for a healthcare provider
      than encryption alone.
    mitre:
      technique_id: T1567.002
      technique_name: "Exfiltration to Cloud Storage"
      tactic: Exfiltration
    network:
      protocol: tcp
      src_ip: 10.8.20.14
      src_port: 49882
      dst_ip: 185.199.108.153
      dst_port: 443
      action: allow
      app: ssl
      rule_name: "allow-outbound-https"
      bytes_sent: 44023414784
      bytes_received: 2841600

  # ---- Defense evasion: the visibility gap opens ------------------------
  - id: edr-tamper
    at: "+8d7h12m"
    event_type: log_cleared
    log_sources: [crowdstrike, windows]
    severity: critical
    actor: svc_imaging
    host: fileserver
    description: >
      THE VISIBILITY GAP OPENS. The EDR sensor on FS-CORE-02 is uninstalled.
      This is the LAST CrowdStrike event for this host — everything after it
      on the file server, including the encryption itself, is absent from
      EDR entirely and must be reconstructed from Windows events and
      firewall telemetry.

      Two teaching points. The uninstall itself is recorded before the agent
      stops, so the gap has a precise start time. And a sensor going silent
      on one server while others keep reporting is itself a detectable
      condition — an absence that should have alerted.
    mitre:
      technique_id: T1562.001
      technique_name: "Impair Defenses: Disable or Modify Tools"
      tactic: Defense Evasion
    process:
      pid: 7402
      ppid: 6640
      name: msiexec.exe
      command_line: '"msiexec.exe" /x {5A2B91C4-7E30-4F18-B6D2-90AC1E374BD8} /qn NOREBOOT=1'
      parent_name: cmd.exe
      integrity_level: System

  - id: shadow-copy-delete
    at: "+8d7h44m"
    event_type: file_deleted
    log_sources: [windows]
    severity: critical
    actor: svc_imaging
    host: fileserver
    description: >
      Volume shadow copies are deleted across the estate. NOT visible in
      CrowdStrike — the sensor is already gone from this host, which is why
      this appears only in Windows events. This is the moment local recovery
      options close, and in most ransomware cases it is the last reliable
      warning before encryption.
    mitre:
      technique_id: T1490
      technique_name: "Inhibit System Recovery"
      tactic: Impact
    process:
      pid: 7550
      ppid: 6640
      name: vssadmin.exe
      command_line: '"vssadmin.exe" delete shadows /all /quiet'
      parent_name: cmd.exe
      integrity_level: System

  - id: gpo-deployment
    at: "+8d8h9m"
    event_type: scheduled_task_created
    log_sources: [windows]
    severity: critical
    actor: svc_imaging
    host: dc
    description: >
      DELIVERY MECHANISM. A Group Policy Object is modified to create an
      immediate scheduled task across the domain, pointing at the encryptor
      staged on a share. This is how one compromised account becomes 214
      encrypted endpoints in under an hour. Students should identify GPO as
      the distribution channel, not just note that encryption occurred.
    mitre:
      technique_id: T1484.001
      technique_name: "Domain or Tenant Policy Modification: Group Policy Modification"
      tactic: Defense Evasion
    extra:
      gpo_name: "AVH-Workstation-Baseline"
      modification: "immediate scheduled task added"
      task_command: "\\\\FS-CORE-02\\NETLOGON$\\svcupd.exe"

  - id: encryption-begins
    at: "+8d8h26m"
    event_type: ransomware_encryption
    log_sources: [windows]
    severity: critical
    actor: svc_imaging
    host: fileserver
    description: >
      Encryption begins on the file server. Absent from CrowdStrike because
      the sensor was removed 74 minutes earlier — the single clearest
      demonstration in this catalog of why an EDR gap matters. Reconstructing
      the encryption phase requires Windows events plus the firewall record
      of SMB traffic to the affected shares.
    mitre:
      technique_id: T1486
      technique_name: "Data Encrypted for Impact"
      tactic: Impact
    process:
      pid: 8120
      ppid: 1
      name: svcupd.exe
      command_line: '"C:\Windows\Temp\svcupd.exe" --threads 16 --net --no-local'
      parent_name: taskeng.exe
      sha256: "a1c93f2e5b6047d8130ae62c94f5b70d28e341ca9057bf16d3820e9c74a5f3b0"
      integrity_level: System

  - id: encryption-spread
