# ForgeIncident scenario file
# =============================================================================
# BEGINNER TIER (curriculum B1). Deliberately the gentlest bundled scenario:
# one victim, one attacker, one clear thread, and no red herrings. It is the
# scenario a newcomer should work first.
#
# What it teaches that nothing else does:
#   - Reading an IDENTITY log (Okta) rather than an endpoint or network log.
#     Many analysts meet SSO logs for the first time during an incident.
#   - Impossible travel as a signal: two successful logins for one account,
#     minutes apart, from different countries.
#   - That a mailbox forwarding rule is the attacker's *persistence*, and
#     survives a password reset. Students who stop at "reset the password"
#     have not finished the job.
#
# Difficulty controls applied here on purpose:
#   - Every malicious event is high or critical severity; nothing subtle.
#   - The two benign events are unmistakably benign (normal morning login
#     from the office IP), so false-positive scoring is exercised without
#     being unfair to a beginner.
#   - Only three log sources, all telling the same story from three angles.
# =============================================================================

scenario_id: phishing-credential-harvest-01
title: "Phishing to Credential Harvest and Mailbox Rule"

description: >
  A finance clerk at Halden Medical Supply receives a phishing email
  impersonating the company's SSO provider, warning that her session will
  expire. She clicks through to a credential-harvesting page and enters her
  password.

  Twelve minutes later the attacker signs in to the real SSO portal as her.
  The sign-in succeeds from an IP geolocated outside the country, minutes
  after a legitimate sign-in from the office — textbook impossible travel.
  MFA is not enforced on this account, which is why a stolen password alone
  was sufficient.

  Once inside the mailbox the attacker creates an inbox rule that forwards
  any message containing "invoice", "payment" or "wire" to an external
  address, then deletes the phishing email from the Sent and Deleted folders
  to slow discovery. The rule is the important artifact: it is persistence,
  it survives a password reset, and it is the mechanism by which a later
  invoice-fraud attempt would be staged.

  The incident is caught by an impossible-travel alert roughly two hours
  after the compromise. No data has left the mailbox at the point the logs
  end, but the forwarding rule was active for that entire window.

student_briefing: >
  Halden Medical Supply's identity provider raised an "impossible travel"
  alert this morning for a user in the finance team. The service desk has
  not yet spoken to the user.

  You have three sources covering this morning: the Okta system log for the
  organization, the Exchange Online message trace, and one recovered email
  message.

  Work out whether this is a real compromise or a false positive. If it is
  real, establish how the account was compromised, everything the attacker
  did while they had access, and what needs to happen to fully remove their
  access. Be specific about why a password reset alone would or would not
  be sufficient.

difficulty: beginner
version: "1.0"
seed: 20250714

organization:
  name: Halden Medical Supply
  domain: haldenmedical.example
  industry: Healthcare Distribution
  timezone: UTC

mitre_tactics:
  - Initial Access
  - Credential Access
  - Persistence
  - Collection

learning_objectives:
  - Read an identity provider (SSO) log and interpret success versus failure outcomes
  - Recognize impossible travel by comparing login times and source addresses
  - Trace a phishing email from message trace through to the recovered message
  - Identify a mailbox forwarding rule as attacker persistence, not just a setting change
  - Explain why a password reset alone does not evict an attacker who has established a rule
  - Distinguish routine user activity from attacker activity in the same log

tags: [phishing, credential-theft, okta, sso, impossible-travel, persistence, beginner]

start_time: "2025-07-14T07:45:00Z"

actors:
  victim:
    username: rhalloran
    email: rhalloran@haldenmedical.example
    display_name: Rosa Halloran
    department: Finance
    role_title: Accounts Payable Clerk
    employee_id: HM-2087
    is_compromised: true
  attacker:
    # Present for instructor context. Identity logs record the account used,
    # never the person behind it -- so this actor is deliberately never
    # referenced by any event. The only handle on the attacker is the IP.
    username: unknown
    email: unknown@unattributed.example
    display_name: Unattributed External Actor
    is_compromised: true

hosts:
  finance-ws:
    hostname: HMS-FIN-114
    ip_address: 10.14.6.114
    host_type: workstation
    os: windows
    os_version: "Windows 11 Pro 24H2"
    domain_joined: true

timeline:
  # ---- Benign baseline: what normal looks like -------------------------
  - id: normal-login
    at: "+0m"
    event_type: account_login_success
    log_sources: [okta]
    severity: info
    actor: victim
    host: finance-ws
    description: >
      BENIGN. Rosa's normal morning sign-in from the office network
      (198.51.100.20 is Halden Medical's corporate egress address). This
      event exists so students have a baseline for what legitimate access
      looks like, and so flagging it counts against them as a false
      positive.
    network:
      protocol: tcp
      src_ip: 198.51.100.20
      src_port: 44120
      dst_ip: 52.12.44.8
      dst_port: 443
      action: allow

  - id: normal-mail-check
    at: "+4m"
    event_type: email_sent
    log_sources: [outlook_message_trace]
    severity: info
    actor: victim
    description: >
      BENIGN. A routine internal email Rosa sends to a colleague about a
      purchase order. Ordinary business correspondence.
    email:
      message_id: "<a41c8f22-7d90-4e13-b6c5-2f18ae0d3c77@haldenmedical.example>"
      sender: rhalloran@haldenmedical.example
      recipients: [dwhitfield@haldenmedical.example]
      subject: "PO 44127 - approved, please process"
      direction: internal
      spf: pass
      dkim: pass
      dmarc: pass
      has_attachment: false

  # ---- The phishing email ----------------------------------------------
  - id: phish-delivered
    at: "+22m"
    event_type: phishing_email_delivered
    log_sources: [outlook_message_trace, email_eml]
    severity: high
    actor: victim
    description: >
      The phishing email is delivered. It impersonates the SSO provider and
      claims the user's session is about to expire. Note the authentication
      results: SPF and DMARC both FAIL. The sending domain
      (haldenmedical-sso.example) is a lookalike of the real corporate
      domain — one character-group different, which is the giveaway a
      student should catch.
    mitre:
      technique_id: T1566.002
      technique_name: "Phishing: Spearphishing Link"
      tactic: Initial Access
    email:
      message_id: "<9f3b71e0-c2a4-4d58-91ff-6e0b845c1a29@haldenmedical-sso.example>"
      sender: security-alert@haldenmedical-sso.example
      recipients: [rhalloran@haldenmedical.example]
      subject: "Action required: your session expires in 24 hours"
      direction: inbound
      spf: fail
      dkim: none
      dmarc: fail
      has_attachment: false
      client_ip: 203.0.113.77
      body_text: >
        Our records show your single sign-on session will expire within 24
        hours. To avoid interruption to your access, please confirm your
        credentials using the secure link below.

        Confirm my account: https://sso-haldenmedical.example/verify

        This is an automated message. Do not reply.

  - id: phish-clicked
    at: "+37m"
    event_type: phishing_email_clicked
    log_sources: [palo_alto]
    severity: high
    actor: victim
    host: finance-ws
    description: >
      Rosa clicks the link. Her workstation connects outbound to the
      credential-harvesting site. The destination IP here is the same one
      that sends the phishing mail, which is the cleanest link between the
      email and the web traffic.
    mitre:
      technique_id: T1566.002
      technique_name: "Phishing: Spearphishing Link"
      tactic: Initial Access
    network:
      protocol: tcp
      src_ip: 10.14.6.114
      src_port: 51882
      dst_ip: 203.0.113.77
      dst_port: 443
      action: allow
      app: ssl
      bytes_sent: 4820
      bytes_received: 18644

  - id: creds-harvested
    at: "+39m"
    event_type: credential_harvested
    log_sources: [palo_alto]
    severity: critical
    actor: victim
    host: finance-ws
    description: >
      Rosa submits her credentials to the fake portal. The larger outbound
      byte count relative to the page load is the form POST carrying her
      username and password.
    mitre:
      technique_id: T1056.003
      technique_name: "Input Capture: Web Portal Capture"
      tactic: Credential Access
    network:
      protocol: tcp
      src_ip: 10.14.6.114
      src_port: 51890
      dst_ip: 203.0.113.77
      dst_port: 443
      action: allow
      app: ssl
      bytes_sent: 2211
      bytes_received: 940

  # ---- The attacker uses the stolen password ---------------------------
  - id: attacker-login-fail
    at: "+49m"
    event_type: account_login_failure
    log_sources: [okta]
    severity: high
    actor: victim
    description: >
      First attempt from the attacker's address fails — a mistyped or
      stale password. A single failure immediately followed by a success
      from the same foreign IP is a stronger signal than either alone.
    mitre:
      technique_id: T1078.004
      technique_name: "Valid Accounts: Cloud Accounts"
      tactic: Initial Access
    network:
      protocol: tcp
      src_ip: 45.9.148.32
      src_port: 39104
      dst_ip: 52.12.44.8
      dst_port: 443
      action: allow

  - id: attacker-login-success
    at: "+51m"
    event_type: account_login_success
    log_sources: [okta]
    severity: critical
    actor: victim
    description: >
      THE COMPROMISE. A successful sign-in as Rosa from 45.9.148.32 — a
      different country, 51 minutes after her legitimate office login from
      198.51.100.20. This is the impossible-travel pair the alert fired on.
      No MFA challenge appears anywhere in the log for this account, which
      is why a stolen password was enough on its own.
    mitre:
      technique_id: T1078.004
      technique_name: "Valid Accounts: Cloud Accounts"
      tactic: Initial Access
    network:
      protocol: tcp
      src_ip: 45.9.148.32
      src_port: 39140
      dst_ip: 52.12.44.8
      dst_port: 443
      action: allow

  # ---- Persistence -------------------------------------------------------
  - id: forwarding-rule
    at: "+58m"
    event_type: email_forwarding_rule_created
    log_sources: [okta, outlook_message_trace]
    severity: critical
    actor: victim
    description: >
      THE PERSISTENCE MECHANISM. An inbox rule is created that forwards any
      message whose subject or body contains "invoice", "payment" or "wire"
      to an external address. This is the single most important artifact in
      the scenario: it survives a password reset, it gives the attacker
      continued visibility of finance correspondence without needing to log
      in again, and it is the staging step for invoice fraud.
    mitre:
      technique_id: T1114.003
      technique_name: "Email Collection: Email Forwarding Rule"
      tactic: Collection
    extra:
      rule_name: "..."
      rule_conditions: "subject or body contains: invoice, payment, wire"
      forward_to: billing-dept@secure-mailfwd.example
      okta_app: "Exchange Online"

  - id: delete-evidence
    at: "+61m"
    event_type: file_deleted
    log_sources: [outlook_message_trace]
    severity: high
    actor: victim
    description: >
      The attacker deletes the original phishing message from the mailbox
      to slow down discovery. The message trace still records it, because
      the trace is server-side and independent of what the mailbox shows —
      a useful lesson in why mail traces matter.
    mitre:
      technique_id: T1070.008
      technique_name: "Indicator Removal: Clear Mailbox Data"
      tactic: Defense Evasion
    email:
      message_id: "<9f3b71e0-c2a4-4d58-91ff-6e0b845c1a29@haldenmedical-sso.example>"
      sender: security-alert@haldenmedical-sso.example
      recipients: [rhalloran@haldenmedical.example]
      subject: "Action required: your session expires in 24 hours"
      direction: inbound
      spf: fail
      dkim: none
      dmarc: fail
      has_attachment: false

  - id: mailbox-browsing
    at: "+1h12m"
    event_type: account_login_success
    log_sources: [okta]
    severity: high
    actor: victim
    description: >
      A second sign-in from the same foreign address, consistent with the
      attacker returning to read mail. Still no MFA challenge.
    mitre:
      technique_id: T1078.004
      technique_name: "Valid Accounts: Cloud Accounts"
      tactic: Initial Access
    network:
      protocol: tcp
      src_ip: 45.9.148.32
      src_port: 40233
      dst_ip: 52.12.44.8
      dst_port: 443
      action: allow

  # ---- Detection ---------------------------------------------------------
  - id: impossible-travel-alert
    at: "+2h34m"
    event_type: alert_triggered
    log_sources: [okta]
    severity: critical
    actor: victim
    description: >
      The identity provider's impossible-travel detection fires, roughly
      one hour and forty minutes after the initial compromise. Discussion
      point for the debrief: the forwarding rule was already in place and
      would have remained active even if the only response had been a
      password reset.
    mitre:
      technique_id: T1078.004
      technique_name: "Valid Accounts: Cloud Accounts"
      tactic: Initial Access

answer_key:
  - id: q1
    question: "Is this a genuine compromise or a false positive? State your evidence."
    answer: >
      Genuine. Two successful sign-ins for rhalloran occurred 51 minutes
      apart from 198.51.100.20 (the corporate office address) and
      45.9.148.32 (a foreign address), which is not physically possible.
      The second address also produced a failed sign-in two minutes before
      succeeding, and no MFA challenge appears for the account at any point.
    related_event_ids: [normal-login, attacker-login-fail, attacker-login-success]
    hint: "Compare the source addresses and times of the successful logins."
    points: 2

  - id: q2
    question: "How was the password obtained?"
    answer: >
      Through a phishing email impersonating the SSO provider, sent from
      the lookalike domain haldenmedical-sso.example with SPF and DMARC
      both failing. Rosa clicked the link at +37m and submitted credentials
      at +39m; the workstation's outbound connections to 203.0.113.77 — the
      same address the mail came from — show both the page load and the
      credential submission.
    related_event_ids: [phish-delivered, phish-clicked, creds-harvested]
    points: 3

  - id: q3
    question: "What did the attacker do once they were inside the mailbox?"
    answer: >
      Two things. First, they created an inbox rule forwarding any message
      containing "invoice", "payment" or "wire" to
      billing-dept@secure-mailfwd.example. Second, they deleted the original
      phishing email from the mailbox to slow discovery. They then signed in
      again at +1h12m, consistent with reading mail.
    related_event_ids: [forwarding-rule, delete-evidence, mailbox-browsing]
    points: 3

  - id: q4
    question: "Would resetting Rosa's password fully evict the attacker? Explain."
    answer: >
      No. The inbox forwarding rule is a mailbox configuration object, not
      a session or a credential — it keeps forwarding mail regardless of
      password changes. Full eviction requires resetting the password AND
      deleting the forwarding rule, revoking active sessions/tokens, and
      enrolling the account in MFA. Reviewing what was forwarded during the
      exposure window is also necessary to assess data loss.
    related_event_ids: [forwarding-rule]
    hint: "Think about which artifacts are tied to the credential and which are not."
    points: 4

  - id: q5
    question: "Which events in these logs are NOT part of the attack?"
    answer: >
      Rosa's 07:45 sign-in from 198.51.100.20 (the office address) and the
      internal email about PO 44127 at 07:49. Both are routine activity and
      form the baseline that makes the later foreign sign-in stand out.
    related_event_ids: [normal-login, normal-mail-check]
    points: 2

  - id: q6
    question: "What single control would most likely have prevented this compromise, and why?"
    answer: >
      Enforced multi-factor authentication on the account. The attacker had
      a valid password but nothing else; no MFA challenge appears anywhere
      in the sign-in log, so the stolen password alone was sufficient. Mail
      filtering on lookalike domains and blocking auto-forwarding to
      external addresses would each have reduced impact, but MFA would have
      stopped the account takeover outright.
    related_event_ids: [attacker-login-success, forwarding-rule]
    points: 3
