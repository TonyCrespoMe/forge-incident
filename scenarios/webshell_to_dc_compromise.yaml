  - id: dc-ntlm-logon
    at: "+2h40m38s"
    event_type: account_login_success
    log_sources: [windows]
    severity: critical
    actor: dmontoya
    host: dccore01
    description: >
      The pass-the-hash lands. An NTLM (NtLmSsp) network logon for "dmontoya"
      arrives at the DC from APPSRV-02. In a Kerberos-first Active Directory
      environment, NTLM authentication FROM A SERVER is strongly anomalous —
      this is the highest-value detection signature on the domain controller
      side, and distinguishing it from the surrounding Kerberos traffic is a
      core objective of this scenario.
    mitre:
      technique_id: T1550.002
      technique_name: "Use Alternate Authentication Material: Pass the Hash"
      tactic: Lateral Movement
    extra:
