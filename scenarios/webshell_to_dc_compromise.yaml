    severity: critical
    actor: iis_pool
    host: appsrv02
    description: >
      Invoke-SMBExec is uploaded. Unlike WMIExec, SMBExec creates a service
      on the target for each command — which is why the DC-side evidence
      changes character from here on.
    mitre:
