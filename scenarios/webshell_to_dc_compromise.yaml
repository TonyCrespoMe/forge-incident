  - id: dc-service-dir
    at: "+2h53m28s"
    event_type: service_installed
    log_sources: [windows]
    severity: critical
    actor: dmontoya
    host: dccore01
    description: >
      The corresponding service install on the DC, one second after the
      command left APPSRV-02. Pairing these two events across hosts is the
      cleanest demonstration of the lateral movement in the whole dataset.
    mitre:
