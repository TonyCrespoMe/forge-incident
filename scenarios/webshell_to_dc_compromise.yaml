  - id: dc-alert
    at: "+3h24m0s"
    event_type: alert_triggered
    log_sources: [windows]
    severity: critical
    host: dccore01
    description: >
      Monitoring finally raises an alert on the anomalous service creation
      pattern — roughly three and a half hours after initial access, and
      after the domain controller was already compromised. The dwell time
      between the first web-shell command and this alert is the response
      metric worth discussing in the debrief.
    mitre:
      technique_id: T1569.002
      technique_name: "System Services: Service Execution"
      tactic: Execution

answer_key:
  - id: q1
    question: "How did the attacker gain initial access, and what specific weakness made it possible?"
    answer: >
      Through an unauthenticated, unvalidated file-upload page at
      /portal/vendor-docs/submit.aspx on APPSRV-02. The handler did not restrict
      file types, so the attacker uploaded an ASPX web shell
      ("session-expired.aspx") directly into the web root, where IIS would execute
      it. No credentials and no software vulnerability were required — the
      application simply accepted an executable file.
    related_event_ids: [find-upload-form, upload-webshell, webshell-written]
    hint: "Work backwards from the first request that returned 200 for a path nobody should be requesting."
    points: 3

  - id: q2
    question: "What is the single highest-fidelity host-based indicator that a web shell was present, and why?"
    answer: >
      w3wp.exe (the IIS worker process) writing an .aspx file into the web
      root, followed by w3wp.exe spawning cmd.exe. A web server process has
      essentially no legitimate reason to create executable content in its
      own content directory or to launch a command interpreter; either alone
      justifies an investigation.
    related_event_ids: [webshell-written, recon-whoami]
    points: 3

  - id: q3
    question: "How were the attacker's commands transmitted, and what did they have to do to read them?"
    answer: >
      As base64-encoded values in a "cmd" query-string parameter on GET
      requests to session-expired.aspx. Decoding them reveals the reconnaissance
      sequence (whoami, ipconfig /all, nltest /dclist, whoami /priv,
      tasklist /v) and later the ProcDump and pass-the-hash commands.
    related_event_ids: [recon-whoami, recon-domain, lsass-dump]
    points: 2

  - id: q4
    question: "Was any data exfiltrated? Justify your answer with specific evidence."
    answer: >
      Yes. The LSASS memory dump (svc_cache.bin, ~56 MB) was renamed to
      banner-hero.jpg to masquerade as web content, then retrieved via
      GET /portal/assets/banner-hero.jpg returning 200 with a transfer time of
      125,871 ms. Identifying the dump and the rename is not sufficient —
      the retrieval is what confirms exfiltration. Consequently EVERY
      credential cached in LSASS on APPSRV-02 must be treated as compromised,
      including the APPSRV-02 machine account, not only the dmontoya account the
      attacker was subsequently observed using.
    related_event_ids: [lsass-dump, masquerade-dump, exfil-dump]
    hint: "Dumping credentials and stealing credentials are two different events. Look for both."
    points: 4

  - id: q5
    question: "How did the attacker authenticate to the domain controller, and what makes that authentication anomalous?"
    answer: >
      Pass-the-hash using the NTLM hash 3ba61d9c7f04e28a5c6d13804f9ae7b2 for
      the domain account "dmontoya", via Invoke-WMIExec and then
      Invoke-SMBExec. On the DC this appears as an NTLM/NtLmSsp network
      (type 3) logon originating from APPSRV-02 (10.42.10.90). In a
      Kerberos-first Active Directory environment, NTLM authentication
      arriving from a member server is strongly anomalous and is the key
      DC-side detection signature.
    related_event_ids: [pth-wmiexec, dc-ntlm-logon]
    points: 3

  - id: q6
    question: "What pattern on the domain controller indicates PsExec-style remote execution, and how many such executions occurred?"
    answer: >
      Windows event ID 7045 service installations with random 20-character
      uppercase names, each running %COMSPEC% /C with the attacker's command
      as the ImagePath, under the LocalSystem account. Six occurred:
      QMZVTKDHRWNPLBXGCJUE (whoami), HTBKWNQZFYDMRVPXLCAG (hostname),
      VDNXQGJTMBRWKPHYZFLC (dir C:\), LWCPMFKXTZBQNRVJDGHA (mkdir C:\ProgramData\svccache),
      GBZRTNWQVKMDPFXCLJYH (payload download), NFKQWDVXZPMTGCJBRHYL
      (payload execution). Legitimate software does not name services this way.
    related_event_ids: [dc-recon-whoami, dc-recon-hostname, dc-service-dir, dc-service-mkdir, dc-download-payload, dc-execute-payload]
    points: 3

  - id: q7
    question: "Two attacker actions on the domain controller have no corresponding entry in the IIS log. Identify them and explain why."
    answer: >
      The service installs QMZVTKDHRWNPLBXGCJUE (whoami) at 08:49 and
      HTBKWNQZFYDMRVPXLCAG (hostname) at 08:50 appear on DC-CORE-01 with no
      matching web-shell request. The commands were delivered to the shell
      by HTTP POST, and IIS logs the query string but never the request
      body. The correct conclusion is that the web log understates the
      attacker's activity, and the correct recommendation is to enable
      request-body logging or deploy a WAF so POST-borne commands are
      captured. Reporting only what the web log shows would under-scope the
      incident.
    related_event_ids: [dc-recon-whoami, dc-recon-hostname]
    hint: "Compare the DC service installs against the web log one for one. Two don't reconcile. Why might that be, given how IIS logging works?"
    points: 4

  - id: q8
    question: "What is the correct scope of this compromise, and what remediation does that scope require?"
    answer: >
      The attacker achieved SYSTEM-level code execution on a domain
      controller, so the entire Active Directory domain must be treated as
      compromised — not merely APPSRV-02 and the dmontoya account. Required
      remediation includes a krbtgt double-reset, rotation of all domain
      credentials (including service and machine accounts), DSRM password
      reset, a rebuild-versus-remediate decision for DC-CORE-01, and rebuilding
      APPSRV-02 from known-good media. Resetting only dmontoya's password would
      leave the attacker's access intact via the exfiltrated LSASS dump and
      any persistence established by the unrecovered second-stage script.
    related_event_ids: [dc-execute-payload, exfil-dump]
    points: 4

  - id: q9
    question: "What could you NOT determine from the available evidence, and what would you request?"
    answer: >
      The contents and behavior of the second-stage payload (sysprep-helper.ps1) are
      unknown; the logs end shortly after execution. Also undetermined: what
      the POST-delivered commands were, whether persistence was established
      on DC-CORE-01, and whether other hosts were touched. Requests should
      include PowerShell ScriptBlock/Module logging from DC-CORE-01, the sysprep-helper.ps1
      file itself or an EDR capture of its execution, IIS request-body or
      WAF logs, network flow/proxy data for the paste-site connection and
      the banner-hero.jpg download, and logs predating 06:00 to establish
      whether reconnaissance began earlier.
    related_event_ids: [dc-execute-payload, dc-recon-whoami]
    points: 3
