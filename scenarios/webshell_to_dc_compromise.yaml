  # ---- Lateral movement tooling ------------------------------------------
  - id: upload-wmiexec
    at: "+2h11m55s"
    event_type: malware_download
    log_sources: [iis, windows]
    severity: critical
    actor: iis_pool
    host: appsrv02
    description: >
      Invoke-WMIExec is uploaded — a PowerShell pass-the-hash utility that
      authenticates with an NTLM hash rather than a password.
    mitre:
      technique_id: T1105
      technique_name: "Ingress Tool Transfer"
