  - id: pth-wmiexec
    at: "+2h40m37s"
    event_type: lateral_movement
    log_sources: [iis, windows]
    severity: critical
    actor: iis_pool
    host: appsrv02
    description: >
      First pass-the-hash attempt, using the NTLM hash for "dmontoya"
