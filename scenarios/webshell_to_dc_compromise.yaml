      technique_name: "Ingress Tool Transfer"
      tactic: Command and Control
    http:
      method: POST
      uri_stem: /portal/vendor-docs/session-expired.aspx
      status_code: 200
      time_taken_ms: 3
    file:
      path: C:\inetpub\wwwroot\portal\assets\Invoke-HostQuery.ps1
      filename: Invoke-HostQuery.ps1
      sha256: "e0a71c94b2d385f6017ac48e93b2f5d70c81a6394fe2b70d85c19a4f632d087c"
      size_bytes: 38104
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 53010
      dst_ip: 10.42.10.90
      dst_port: 80
