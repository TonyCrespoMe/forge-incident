    log_sources: [windows]
    severity: critical
    actor: dmontoya
    host: dccore01
    description: >
      Final observed action: the second stage executes as SYSTEM on the
      domain controller via one more throwaway service. Whatever this script
      did is unknown — the logs end shortly afterward. This is the point at
      which the entire domain must be considered compromised, and the
      correct remediation is a krbtgt double-reset plus full credential
      rotation, not simply disabling the dmontoya account.
    mitre:
      technique_id: T1059.001
      technique_name: "Command and Scripting Interpreter: PowerShell"
      tactic: Execution
    service:
      service_name: NFKQWDVXZPMTGCJBRHYL
      image_path: '%COMSPEC% /C "PowerShell -ExecutionPolicy Bypass -NoProfile -File C:\ProgramData\svccache\sysprep-helper.ps1"'
      start_type: demand start
