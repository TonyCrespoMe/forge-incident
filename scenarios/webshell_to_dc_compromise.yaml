# ForgeIncident scenario file
# =============================================================================
# The most demanding bundled scenario. It follows a well-documented public
# intrusion pattern (unrestricted upload -> web shell -> LSASS dump ->
# pass-the-hash -> service-execution on a domain controller), and exists to
# teach three things the other bundled scenarios don't. Every organization,
# host, account, address, hash, and filename below is invented for this
# scenario.
#
# 1. ENCODED COMMANDS. Web-shell commands ride in a base64 `cmd=` query
#    parameter. The IIS emitter encodes them, so students must recognize and
#    decode base64 rather than reading the attack in cleartext.
#
# 2. DELIBERATE VISIBILITY GAPS. Two events (`dc-recon-whoami` and
#    `dc-recon-hostname`) are routed ONLY to the domain controller. They are
#    the result of web-shell commands delivered by HTTP POST, and IIS never
#    logs POST bodies — so those commands are genuinely absent from the web
#    log. A student who only reads APPSRV-02 will under-report the intrusion.
#    Teaching students to say "more happened than I can see, here is how I
#    know, here is how to close the gap" is the point.
#
# 3. EXFILTRATION AS A DISTINCT EVENT. The LSASS dump is renamed to
#    `banner-hero.jpg` and then RETRIEVED over HTTP. Many analysts spot the
#    dump and the rename but stop before confirming the download — which is
#    the difference between "credentials were dumped on a host we control"
#    and "a full credential dump left the network". The answer key grades
#    that distinction explicitly.
#
# The kill chain: unrestricted upload -> web shell -> recon -> LSASS dump via
# ProcDump -> masquerade + exfil -> pass-the-hash to the DC -> service-install
# execution (7045) -> second-stage payload from a paste site, run as SYSTEM.
# =============================================================================

scenario_id: webshell-to-dc-compromise-01
title: "Web Shell to Domain Controller Compromise"

description: >
  An externally-facing IIS server at Meridian Freight (APPSRV-02) exposes an
  unauthenticated file-upload page that does not validate file type. An
  external actor at 193.27.14.86 discovers it by directory probing, uploads
  an ASPX web shell named to blend in with the application's own error
  pages ("session-expired.aspx"), and gains code execution as the IIS
  application pool identity.

  From that shell the actor runs host and domain reconnaissance, uploads
  ProcDump, and dumps the LSASS process to disk. The dump is renamed to
  "banner-hero.jpg" so it looks like ordinary web content, then downloaded over
  plain HTTP — this is the actual exfiltration, and it means every credential
  cached on APPSRV-02 must be considered compromised, not just the one the actor
  went on to use.

  From the dump the actor recovers the NTLM hash for the domain account
  "dmontoya", which holds local administrator rights on the domain controller.
  Using Invoke-WMIExec and then Invoke-SMBExec, they pass that hash to
  DC-CORE-01. Each SMBExec command lands on the DC as a throwaway Windows service
  with a random 20-character name (EID 7045) executing via %COMSPEC% — the
  classic PsExec-style signature. The final service downloads a second-stage
  PowerShell payload from a paste site and executes it as SYSTEM.

  Two of the DC-side commands were delivered to the web shell by HTTP POST.
  IIS does not log request bodies, so those two commands appear on the domain
  controller with no corresponding entry in the web log. This is intentional:
  the evidence supports the conclusion that the actor's access was broader
  than the web log alone can prove.

  Impact: SYSTEM-level code execution on a domain controller. The entire
  domain must be treated as compromised — krbtgt reset and full credential
  rotation, not merely resetting the single account observed in the logs.

student_briefing: >
  Meridian Freight's monitoring picked up an alert overnight for anomalous
  service creation on DC-CORE-01, the company's domain controller. Nobody on the
  infrastructure team recognizes the service names, and no change request
  covers that window.

  You have three sources covering 2025-03-09: the IIS access log from APPSRV-02
  (the public-facing web server), Windows event logs from APPSRV-02 including
  Sysmon, and Windows event logs from DC-CORE-01.

  Determine what happened. Your report should establish how the intruder
  first got in, what they did on each host, whether any data left the
  environment, and what the scope of the compromise is. State clearly what
  you can prove from the evidence, what you assess as likely, and what you
  cannot determine from the logs provided.

difficulty: advanced
version: "1.0"
seed: 20250309

organization:
  name: Meridian Freight
  domain: meridianfreight.example
  industry: Logistics
  timezone: UTC

mitre_tactics:
  - Initial Access
  - Execution
  - Persistence
  - Credential Access
  - Discovery
  - Lateral Movement
  - Collection
  - Exfiltration

learning_objectives:
  - Identify an unrestricted file upload as the initial access vector from web logs alone
  - Recognize and decode base64-encoded commands smuggled through query strings
  - Spot w3wp.exe spawning cmd.exe as the definitive web-shell execution signature
  - Distinguish credential dumping from confirmed credential exfiltration
  - Recognize the 7045 random-service-name pattern as PsExec-style remote execution
  - Distinguish NTLM pass-the-hash logons from normal Kerberos authentication
  - Identify and articulate a logging visibility gap rather than under-reporting
  - Scope a domain controller compromise correctly (whole-domain, not single-account)

tags: [web-shell, iis, pass-the-hash, lsass, exfiltration, domain-compromise, lateral-movement]

start_time: "2025-03-09T06:00:00Z"

actors:
  attacker:
    # Never referenced as an `actor:` on web-log events: an IIS log records a
    # client IP, never an identity. The only attributable identity in this
    # incident is the domain account whose hash was stolen.
    username: unknown
    email: unknown@unattributed.example
    display_name: Unattributed External Actor
    is_compromised: true
  iis_pool:
    username: DefaultAppPool
    email: apppool@meridianfreight.example
    display_name: "IIS APPPOOL\\DefaultAppPool"
    department: Service Account
    role_title: IIS Application Pool Identity
  dmontoya:
    username: dmontoya
    email: dmontoya@meridianfreight.example
    display_name: Diego Montoya
    department: Infrastructure
    role_title: Systems Administrator
    employee_id: MF-4417
    is_compromised: true
    is_privileged: true

hosts:
  appsrv02:
    hostname: APPSRV-02
    ip_address: 10.42.10.90
    host_type: server
    os: windows
    os_version: "Windows Server 2019 Standard"
    domain_joined: true
  dccore01:
    hostname: DC-CORE-01
    ip_address: 10.42.10.10
    host_type: domain_controller
    os: windows
    os_version: "Windows Server 2019 Datacenter"
    domain_joined: true

timeline:
  # ---- Discovery of the upload page -------------------------------------
  - id: probe-root
    at: "+0m"
    event_type: web_request
    log_sources: [iis]
    severity: info
    description: >
      First contact. The actor requests the default IIS start page from
      193.27.14.86 using an ordinary Edge user-agent. Note for instructors:
      the scenario contains no scanner-like user-agents at all. Analysts who
      hunt for "curl/nikto/sqlmap" will find nothing; this intrusion is only
      visible through anomalous PATHS, not anomalous agents.
    mitre:
      technique_id: T1595
      technique_name: "Active Scanning"
      tactic: Reconnaissance
    http:
      method: GET
      uri_stem: /iisstart.png
      status_code: 200
      time_taken_ms: 1
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51022
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: probe-miss
    at: "+3m7s"
    event_type: web_request
    log_sources: [iis]
    severity: low
    description: >
      Path guessing. A 404 for a page that does not exist — the actor is
      enumerating application paths by hand.
    http:
      method: GET
      uri_stem: /admin.aspx
      status_code: 404
      time_taken_ms: 69
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51044
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: find-uploadsite
    at: "+5m8s"
    event_type: web_request
    log_sources: [iis]
    severity: medium
    description: >
      The actor finds the upload application directory. A 200 here is the
      pivot point of the entire intrusion.
    mitre:
      technique_id: T1083
      technique_name: "File and Directory Discovery"
      tactic: Discovery
    http:
      method: GET
      uri_stem: /portal/vendor-docs/health.aspx
      status_code: 200
      time_taken_ms: 52
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51090
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: find-upload-form
    at: "+6m5s"
    event_type: web_request
    log_sources: [iis]
    severity: medium
    description: >
      The unauthenticated upload form itself is retrieved. No credentials
      were required to reach it — this is the vulnerability.
    mitre:
      technique_id: T1190
      technique_name: "Exploit Public-Facing Application"
      tactic: Initial Access
    http:
      method: GET
      uri_stem: /portal/vendor-docs/submit.aspx
      status_code: 200
      time_taken_ms: 8102
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51120
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  # ---- Web shell upload --------------------------------------------------
  - id: upload-webshell
    at: "+6m27s"
    event_type: web_shell_upload
    log_sources: [iis]
    severity: critical
    description: >
      The web shell is uploaded. The upload handler performs no file-type
      validation, so an .aspx file lands inside the web root and is
      therefore executable by the application. Root cause of the incident.
    mitre:
      technique_id: T1505.003
      technique_name: "Server Software Component: Web Shell"
      tactic: Persistence
    http:
      method: POST
      uri_stem: /portal/vendor-docs/submit.aspx
      status_code: 200
      time_taken_ms: 48
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51140
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: webshell-written
    at: "+6m31s"
    event_type: file_created
    log_sources: [windows]
    severity: critical
    actor: iis_pool
    host: appsrv02
    description: >
      Sysmon records w3wp.exe writing the shell to disk. A web server
      process creating an .aspx file inside its own web root is almost never
      legitimate and is the single highest-fidelity detection opportunity in
      this scenario.
    mitre:
      technique_id: T1505.003
      technique_name: "Server Software Component: Web Shell"
      tactic: Persistence
    file:
      path: C:\inetpub\wwwroot\vendor-docs\session-expired.aspx
      filename: session-expired.aspx
      sha256: "9f2c4e1a7b8d3f6052c9ae41d7b30f8e6a145c92db73e0f81a4c6b25d938e7fa"
      size_bytes: 1487

  - id: webshell-first-touch
    at: "+7m6s"
    event_type: web_request
    log_sources: [iis]
    severity: high
    description: >
      The actor confirms the shell is live by requesting it with no command
      parameter. A page named "session-expired.aspx" returning 200 is itself an
      anomaly — a real forbidden-page would return 403.
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      status_code: 200
      time_taken_ms: 46
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51180
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  # ---- Host and domain reconnaissance ------------------------------------
  - id: recon-whoami
    at: "+8m49s"
    event_type: web_shell_command
    log_sources: [iis, windows]
    severity: high
    actor: iis_pool
    host: appsrv02
    description: >
      First command through the shell, base64-encoded in the query string.
      Establishes the shell runs as the application pool identity.
    mitre:
      technique_id: T1033
      technique_name: "System Owner/User Discovery"
      tactic: Discovery
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: "whoami"
      status_code: 200
      time_taken_ms: 60
    process:
      pid: 4180
      ppid: 3096
      name: cmd.exe
      command_line: '"cmd.exe" /c whoami'
      parent_name: w3wp.exe
      integrity_level: High
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51210
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: recon-network
    at: "+9m38s"
    event_type: web_shell_command
    log_sources: [iis, windows]
    severity: high
    actor: iis_pool
    host: appsrv02
    description: >
      Network configuration enumeration, revealing the internal subnet and
      the domain controller's address.
    mitre:
      technique_id: T1016
      technique_name: "System Network Configuration Discovery"
      tactic: Discovery
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: "ipconfig /all"
      status_code: 200
      time_taken_ms: 61
    process:
      pid: 4232
      ppid: 3096
      name: cmd.exe
      command_line: '"cmd.exe" /c ipconfig /all'
      parent_name: w3wp.exe
      integrity_level: High
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51244
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: recon-domain
    at: "+10m44s"
    event_type: web_shell_command
    log_sources: [iis, windows]
    severity: high
    actor: iis_pool
    host: appsrv02
    description: >
      Domain controller enumeration. The actor now knows which host to
      target for lateral movement.
    mitre:
      technique_id: T1018
      technique_name: "Remote System Discovery"
      tactic: Discovery
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: "nltest /dclist:meridianfreight"
      status_code: 200
      time_taken_ms: 11259
    process:
      pid: 4288
      ppid: 3096
      name: cmd.exe
      command_line: '"cmd.exe" /c nltest /dclist:meridianfreight'
      parent_name: w3wp.exe
      integrity_level: High
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 51281
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: recon-privs
    at: "+1h20m18s"
    event_type: web_shell_command
    log_sources: [iis, windows]
    severity: high
    actor: iis_pool
    host: appsrv02
    description: >
      After a 70-minute pause the actor returns and checks token privileges,
      confirming SeImpersonatePrivilege is available to the pool identity.
    mitre:
      technique_id: T1033
      technique_name: "System Owner/User Discovery"
      tactic: Discovery
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: "whoami /priv"
      status_code: 200
      time_taken_ms: 88
    process:
      pid: 4402
      ppid: 3096
      name: cmd.exe
      command_line: '"cmd.exe" /c whoami /priv'
      parent_name: w3wp.exe
      integrity_level: High
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 52010
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: recon-lsass-pid
    at: "+1h20m40s"
    event_type: web_shell_command
    log_sources: [iis, windows]
    severity: high
    actor: iis_pool
    host: appsrv02
    description: >
      Process listing. This is how the actor learns the LSASS process ID
      (672) used in the ProcDump command shortly afterward — the two events
      should be correlated by students.
    mitre:
      technique_id: T1057
      technique_name: "Process Discovery"
      tactic: Discovery
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: "tasklist /v"
      status_code: 200
      time_taken_ms: 1475
    process:
      pid: 4455
      ppid: 3096
      name: cmd.exe
      command_line: '"cmd.exe" /c tasklist /v'
      parent_name: w3wp.exe
      integrity_level: High
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 52044
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  # ---- Tooling upload and credential dumping -----------------------------
  - id: upload-procdump
    at: "+1h34m3s"
    event_type: malware_download
    log_sources: [iis, windows]
    severity: critical
    actor: iis_pool
    host: appsrv02
    description: >
      ProcDump (renamed wmiutil.exe) is uploaded through the same unauthenticated
      form. Signed Microsoft Sysinternals tooling, so antivirus does not
      object — living-off-the-land by design.
    mitre:
      technique_id: T1105
      technique_name: "Ingress Tool Transfer"
      tactic: Command and Control
    http:
      method: POST
      uri_stem: /portal/vendor-docs/submit.aspx
      status_code: 200
      time_taken_ms: 80
    file:
      path: C:\inetpub\wwwroot\portal\assets\wmiutil.exe
      filename: wmiutil.exe
      sha256: "2f5c1b3e7a94d602f8e15c73b0a486d29fc31e5b7480a2c96de35f18b7c4029a"
      size_bytes: 667816
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 52310
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: lsass-dump
    at: "+1h56m8s"
    event_type: credential_harvested
    log_sources: [iis, windows]
    severity: critical
    actor: iis_pool
    host: appsrv02
    description: >
      LSASS memory is dumped to disk with ProcDump against PID 672. Note
      Sysmon fires its "Sysinternals Tool Used" rule here — a detection that
      existed and produced telemetry, but evidently generated no response.
    mitre:
      technique_id: T1003.001
      technique_name: "OS Credential Dumping: LSASS Memory"
      tactic: Credential Access
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: 'C:\inetpub\wwwroot\portal\assets\wmiutil.exe -accepteula -ma 672 C:\inetpub\wwwroot\portal\assets\svc_cache.bin'
      status_code: 200
      time_taken_ms: 800
    process:
      pid: 4512
      ppid: 3096
      name: wmiutil.exe
      command_line: 'C:\inetpub\wwwroot\portal\assets\wmiutil.exe -accepteula -ma 672 C:\inetpub\wwwroot\portal\assets\svc_cache.bin'
      parent_name: w3wp.exe
      sha256: "2f5c1b3e7a94d602f8e15c73b0a486d29fc31e5b7480a2c96de35f18b7c4029a"
      integrity_level: High
    file:
      path: C:\inetpub\wwwroot\portal\assets\svc_cache.bin
      filename: svc_cache.bin
      sha256: "c7e42a19b6f3058d1cb94e27a5f60d38e91b47c25d0a0f38b91e64c27a5d0e93"
      size_bytes: 58720256
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 52501
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: masquerade-dump
    at: "+2h7m52s"
    event_type: file_modified
    log_sources: [iis, windows]
    severity: high
    actor: iis_pool
    host: appsrv02
    description: >
      The dump is renamed with a .png extension so it blends into ordinary
      web content and can be fetched over HTTP without looking unusual.
      Defense evasion via masquerading.
    mitre:
      technique_id: T1036.008
      technique_name: "Masquerading: Masquerade File Type"
      tactic: Defense Evasion
    http:
      method: GET
      uri_stem: /portal/vendor-docs/session-expired.aspx
      cmd_plaintext: 'move C:\inetpub\wwwroot\portal\assets\svc_cache.bin C:\inetpub\wwwroot\portal\assets\banner-hero.jpg'
      status_code: 200
      time_taken_ms: 61
    file:
      path: C:\inetpub\wwwroot\portal\assets\banner-hero.jpg
      filename: banner-hero.jpg
      sha256: "c7e42a19b6f3058d1cb94e27a5f60d38e91b47c25d0a0f38b91e64c27a5d0e93"
      size_bytes: 58720256
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 52672
      dst_ip: 10.42.10.90
      dst_port: 80
      action: allow

  - id: exfil-dump
    at: "+2h8m8s"
    event_type: data_exfiltration
    log_sources: [iis]
    severity: critical
    description: >
      THE EXFILTRATION. The renamed LSASS dump is downloaded over plain
      HTTP. 56 MB leaving the network in a single GET, and the long
      time-taken value reflects the transfer. Many analysts spot the dump
      and the rename but never confirm the retrieval — this event is what
      escalates the incident from "credentials dumped locally" to "every
      credential cached on APPSRV-02 is in the actor's possession", including
      the machine account and any other sessions present in memory.
    mitre:
      technique_id: T1041
      technique_name: "Exfiltration Over C2 Channel"
      tactic: Exfiltration
    http:
      method: GET
      uri_stem: /portal/assets/banner-hero.jpg
      status_code: 200
      time_taken_ms: 98432
      bytes_sent: 58720256
    file:
      path: C:\inetpub\wwwroot\portal\assets\banner-hero.jpg
      filename: banner-hero.jpg
      sha256: "c7e42a19b6f3058d1cb94e27a5f60d38e91b47c25d0a0f38b91e64c27a5d0e93"
      size_bytes: 58720256
    network:
      protocol: tcp
      src_ip: 193.27.14.86
      src_port: 52604
      dst_ip: 10.42.10.90
      dst_port: 80
