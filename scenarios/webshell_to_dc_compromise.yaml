  # ---- The visibility gap: POST-delivered commands ------------------------
  - id: dc-recon-whoami
    at: "+2h49m26s"
    event_type: service_installed
    log_sources: [windows]
    severity: critical
    actor: dmontoya
    host: dccore01
    description: >
      VISIBILITY GAP (1 of 2). A throwaway service executes "whoami" on the
      domain controller. The command that triggered this was delivered to
      the web shell by HTTP POST, and IIS does not log request bodies — so
      there is NO corresponding entry in the web log for this event. A
      student who reconstructs the intrusion only from APPSRV-02 will miss it
      entirely and under-report the attacker's activity.
    mitre:
      technique_id: T1569.002
      technique_name: "System Services: Service Execution"
      tactic: Execution
    service:
      service_name: QMZVTKDHRWNPLBXGCJUE
      image_path: '%COMSPEC% /C "whoami"'
      start_type: demand start
      account: LocalSystem

  - id: dc-recon-hostname
    at: "+2h50m19s"
    event_type: service_installed
    log_sources: [windows]
    severity: critical
    actor: dmontoya
    host: dccore01
    description: >
      VISIBILITY GAP (2 of 2). Same pattern — another POST-delivered command
      visible only on the DC. The random 20-character uppercase service name
      is the signature of Invoke-SMBExec / PsExec-style tooling; legitimate
      software does not name services this way.
    mitre:
      technique_id: T1569.002
      technique_name: "System Services: Service Execution"
      tactic: Execution
    service:
